[tool.poetry]
name = "mammoth-mcp"
version = "0.1.0"
description = "MCP server for Mammoth Analytics — lets LLMs explore, transform, and export data"
authors = ["Mammoth Analytics <support@mammoth.io>"]
readme = "README.md"
homepage = "https://mammoth.io"
repository = "https://github.com/EdgeMetric/mm-pysdk"
keywords = ["mammoth", "analytics", "mcp", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
packages = [{include = "mammoth_mcp"}]

[tool.poetry.dependencies]
python = "^3.10"
mcp = "^1.26.0"
mammoth-io = "^0.2.0"
redis = {version = "^5.0", extras = ["hiredis"]}
httpx = "^0.28"
pydantic-settings = "^2.0"
uvicorn = {version = "^0.34", extras = ["standard"]}

[tool.poetry.scripts]
mammoth-mcp = "mammoth_mcp.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
