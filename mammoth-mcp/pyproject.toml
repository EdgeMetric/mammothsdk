[project]
name = "mammoth-mcp"
version = "0.1.0"
description = "MCP server for Mammoth Analytics — lets LLMs explore, transform, and export data"
authors = [{name = "Mammoth Analytics", email = "support@mammoth.io"}]
license = "LicenseRef-Proprietary"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp (>=1.26.0,<2.0.0)",
    "mammoth-io (>=0.7.0,<0.8)",
    "redis[hiredis] (>=5.0,<6.0)",
    "httpx (>=0.28,<0.29)",
    "pydantic-settings (>=2.0,<3.0)",
    "uvicorn[standard] (>=0.34,<0.35)",
    "cryptography (>=48.0.1,<50.0.0)",
]
urls = {homepage = "https://mammoth.io", repository = "https://github.com/EdgeMetric/mammothsdk"}
keywords = ["mammoth", "analytics", "mcp", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
mammoth-mcp = "mammoth_mcp.server:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["UP007", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"mammoth_mcp/tools/help.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mammoth_mcp"]
# Pin an interoperable Core Metadata version while build consumers catch up
# with Metadata 2.5. Version 2.4 retains PEP 639 license metadata.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
