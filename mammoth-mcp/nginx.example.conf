# Mammoth MCP — nginx reverse proxy for 3 server profiles.
#
# Each profile runs on a separate port (set by start.sh):
#   transformations  → 9000  (data exploration & transformation)
#   import           → 9001  (webhooks, connectors, files, batches)
#   admin            → 9002  (org, dashboards, automations, users)
#
# Replace 10.0.3.207 with the MCP server's private IP.
# The trailing slash on proxy_pass strips the location prefix
# so the backend always sees root-relative paths (e.g. /mcp, /authorize).

upstream mcp_transformations {
    server 10.0.3.207:9000;
    keepalive 32;
}
upstream mcp_import {
    server 10.0.3.207:9001;
    keepalive 32;
}
upstream mcp_admin {
    server 10.0.3.207:9002;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;

    server_name mcp.mammoth.io;

    ssl_certificate     /etc/letsencrypt/live/mammoth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mammoth.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # ── Transformations ──────────────────────────────────────
    location /transformations/ {
        proxy_pass http://mcp_transformations/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 75s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    300s;

        proxy_buffering off;
    }

    # ── Import ───────────────────────────────────────────────
    location /import/ {
        proxy_pass http://mcp_import/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 75s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    300s;

        proxy_buffering off;
    }

    # ── Admin ────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://mcp_admin/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 75s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    300s;

        proxy_buffering off;
    }

    # ── Root → transformations (backward compat) ─────────────
    location / {
        proxy_pass http://mcp_transformations;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 75s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    300s;

        proxy_buffering off;
    }
}
