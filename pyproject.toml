[project]
name = "mammoth-io"
version = "0.7.13"
description = "Python SDK for Mammoth Analytics platform"
authors = [{name = "Mammoth Analytics", email = "support@mammoth.io"}]
license = "LicenseRef-Proprietary"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "requests (>=2.32,<3)",
    "pydantic (>=2.10,<3)",
]
urls = {homepage = "https://mammoth.io", repository = "https://github.com/EdgeMetric/mammothsdk", documentation = "https://docs.mammoth.io"}
keywords = ["mammoth", "analytics", "data", "api", "sdk"]
optional-dependencies.bridge = [
    "flask (==3.1.3)",
    "python-dotenv (==1.2.2)",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

# Poetry still provisions the SDK release and CI environments.  The
# distribution name normalizes to ``mammoth_io``, while the import package is
# deliberately named ``mammoth``, so automatic package discovery is wrong.
[tool.poetry]
packages = [{include = "mammoth"}]

[dependency-groups]
dev = [
    "pytest (==9.0.3)",
    "pytest-cov (==7.1.0)",
    "black (==26.5.1)",
    "ruff (==0.15.15)",
    "mypy (==2.1.0)",
    "types-requests (==2.33.0.20260518)",
    "mkdocs-material (==9.7.6)",
    "mkdocstrings[python] (==1.0.4)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mammoth"]
# Pin an interoperable Core Metadata version while build consumers catch up
# with Metadata 2.5. Version 2.4 retains PEP 639 license metadata.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "mammoth/**",
    "docs/**",
    ".claude/skills/mammoth-sdk/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "mkdocs.yml",
]
exclude = [
    ".claude/projects/**",
    ".github/**",
    "bridge/**",
    "mammoth-cli/**",
    "mammoth-mcp/**",
    "tests/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no API calls)",
    "integration: Integration tests (requires live API)",
    "slow: Slow tests",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# The SDK supports Python 3.12, but these mechanical modernizations would make
# unrelated public-model changes in a release-only patch.
ignore = ["UP007", "UP040", "UP042", "UP046", "SIM108"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "mammoth.api.*"
warn_return_any = false
# API methods call _request() which returns dict | list; methods narrow to dict
# This is a standard SDK pattern — ignore return type narrowing errors
disable_error_code = ["return-value", "arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "mammoth._mixins.*"
# Mixin methods access View attributes not defined on the mixin class
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "mammoth.view"
warn_return_any = false
