[tool.poetry]
name = "mammoth-io"
version = "0.6.0"
description = "Python SDK for Mammoth Analytics platform"
authors = ["Mammoth Analytics <support@mammoth.io>"]
license = "Proprietary"
readme = "README.md"
homepage = "https://mammoth.io"
repository = "https://github.com/EdgeMetric/mm-pysdk"
documentation = "https://docs.mammoth.io"
keywords = ["mammoth", "analytics", "data", "api", "sdk"]
packages = [{include = "mammoth"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

[tool.poetry.dependencies]
# Matches the CLI's floor (mammoth-cli requires >=3.12,<3.15): the SDK and CLI
# ship from the same monorepo and should not diverge on supported interpreters.
python = ">=3.12,<3.15"
# Runtime deps use ranges, not exact pins: as a library, mm-pysdk must compose
# with whatever versions its consumer applications pin (e.g. mvc-service pins
# requests==2.32.5). Exact pins here cause unsatisfiable resolver conflicts.
requests = ">=2.32,<3"
pydantic = ">=2.10,<3"
flask = {version = "==3.1.3", optional = true}
python-dotenv = {version = "==1.2.2", optional = true}

[tool.poetry.extras]
bridge = ["flask", "python-dotenv"]

[tool.poetry.group.bridge]
optional = true

[tool.poetry.group.bridge.dependencies]
flask = "==3.1.3"
python-dotenv = "==1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "==9.0.3"
pytest-cov = "==7.1.0"
black = "==26.5.1"
ruff = "==0.15.15"
mypy = "==2.1.0"
types-requests = "==2.33.0.20260518"
mkdocs-material = "==9.7.6"
mkdocstrings = {extras = ["python"], version = "==1.0.4"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no API calls)",
    "integration: Integration tests (requires live API)",
    "slow: Slow tests",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["UP007", "SIM108"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "mammoth.api.*"
warn_return_any = false
# API methods call _request() which returns dict | list; methods narrow to dict
# This is a standard SDK pattern — ignore return type narrowing errors
disable_error_code = ["return-value", "arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "mammoth._mixins.*"
# Mixin methods access View attributes not defined on the mixin class
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "mammoth.view"
warn_return_any = false
