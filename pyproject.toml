[tool.poetry]
name = "mammoth-io"
version = "0.2.3"
description = "Python SDK for Mammoth Analytics platform"
authors = ["Ankit Kumar Pandey <ankitpandey@mammoth.io>"]
readme = "README.md"
homepage = "https://mammoth.io"
repository = "https://github.com/EdgeMetric/mm-pysdk"
documentation = "https://docs.mammoth.io"
keywords = ["mammoth", "analytics", "data", "api", "sdk"]
packages = [{include = "mammoth"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.32.0"
pydantic = "^2.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^6.2.0"
black = "^25.1.0"
ruff = "^0.9.0"
mypy = "^1.17.0"
types-requests = "^2.32.0"
mkdocs-material = "^9.6.0"
mkdocstrings = {extras = ["python"], version = "^0.28.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no API calls)",
    "integration: Integration tests (requires live API)",
    "slow: Slow tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["UP007", "SIM108"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "mammoth.api.*"
warn_return_any = false
# API methods call _request() which returns dict | list; methods narrow to dict
# This is a standard SDK pattern — ignore return type narrowing errors
disable_error_code = ["return-value", "arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "mammoth._mixins.*"
# Mixin methods access View attributes not defined on the mixin class
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "mammoth.view"
warn_return_any = false
