name: OpenAPI contract drift

# Production drift is checked out-of-band so network availability never makes
# the deterministic pull-request gate flaky. A failure means the pinned
# method/path inventory must be reviewed and refreshed.
permissions:
  contents: read

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: openapi-contract-drift
  cancel-in-progress: true

jobs:
  compare-live-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mammoth-cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compare pinned and production operation inventories
        run: python scripts/sync_openapi.py --check-live
