name: SDK Release

# Publishes the mammoth-io SDK to PyPI on its own tag, independent of the CLI
# release and of the combined publish.yml flow. This never publishes
# mammoth-mcp. It runs ONLY when an authorized maintainer pushes an `sdk-vX.Y.Z`
# tag. Do not push an `sdk-v*` tag without separate release authorization.
on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Derive version from tag
        id: version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # The tag must be sdk-v<SemVer>. Require the exact prefix, then validate
          # the remainder as STRICT SemVer: MAJOR.MINOR.PATCH with optional
          # -prerelease and +build metadata, fully anchored. The old glob
          # `[0-9]*.[0-9]*.[0-9]*` accepted non-SemVer such as `1.2.3.4` or
          # `1.2.3abc`; this regex does not, so a malformed tag fails fast before
          # any build or publish step runs. (Mirrors cli-release.yml.)
          case "$tag" in
            sdk-v*) : ;;
            *) echo "::error::tag '$tag' is not sdk-vX.Y.Z"; exit 1 ;;
          esac
          version="${tag#sdk-v}"
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$version" | grep -Eq "$semver"; then
            echo "::error::tag '$tag' is not strict SemVer; version '$version' must be MAJOR.MINOR.PATCH[-prerelease][+build]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject version matches tag
        run: |
          set -eu
          declared="$(poetry version --short)"
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::pyproject version '$declared' != tag version '${{ steps.version.outputs.version }}'"
            exit 1
          fi

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint and type-check
        run: |
          set -eu
          poetry run ruff check mammoth/
          poetry run mypy mammoth/

      - name: Unit tests
        run: poetry run pytest tests/unit/ -q

      - name: Build distribution
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: poetry build --output dist

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish mammoth-io to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
