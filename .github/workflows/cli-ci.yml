name: CLI CI

# Continuous integration for the mammoth-cli package. This workflow only reads
# the repository; it never publishes, tags, or creates a release. Release is a
# separate, tag-triggered, authorized workflow.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "mammoth-cli/**"
      - "mammoth/**"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mammoth-cli/**"
      - "mammoth/**"
      - ".github/workflows/cli-ci.yml"

defaults:
  run:
    working-directory: mammoth-cli

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The CLI supports 3.12 through the latest; testing the minimum and the
        # newest covers the support boundaries without a job per minor version.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Poetry stays available purely as the build backend the packaging tests
      # invoke (poetry build); the environment itself is provisioned with pip so
      # the unpublished in-repo SDK satisfies mammoth-io, never PyPI.
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: false

      - name: Install in-repo SDK, CLI, and dev tools
        run: |
          python -m pip install --upgrade pip
          # The in-repo SDK provides mammoth-io 0.6.0 (not yet on PyPI); install
          # it editable FIRST so the CLI's `mammoth-io>=0.6.0,<0.7` constraint
          # resolves against it instead of PyPI (which only has 0.5.1). The
          # shipped wheel still declares the published dependency.
          pip install -e ..
          pip install -e .
          # Dev tooling; names read from pyproject so this list cannot drift.
          pip install $(python -c "import tomllib; g = tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['group']['dev']['dependencies']; print(' '.join(k for k in g if k.lower() != 'python'))")
          # The installer tests exercise the real installer, which uses uv from
          # PATH; provide it so the installer does not try to download uv.
          pip install uv

      - name: Ruff (lint)
        run: ruff check mammoth_cli/ tests/ scripts/

      - name: Mypy (strict)
        run: mypy mammoth_cli/

      # Run the WHOLE non-live suite in one invocation over the entire tests/
      # tree. Naming a subset of directories silently drops the strongest
      # suites (tests/realcode, tests/subprocess); ``live`` is deselected by
      # marker, never by omitting a directory. The
      # tests/contract/test_ci_runs_all_suites.py guard enforces this.
      - name: Test suite (unit, contract, installer, packaging, realcode, subprocess)
        run: pytest tests -m "not live" -q -p no:cacheprovider

  installer-windows:
    name: installer (windows, pwsh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean PowerShell uv bootstrap
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'uv.exe')) }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw 'failed to create a uv-free Windows PATH' }
          ./installers/mammoth-install.ps1 -BootstrapUvOnly -NoModifyPath -NonInteractive
          $uv = Join-Path $env:USERPROFILE '.local\bin\uv.exe'
          if (-not (Test-Path -LiteralPath $uv)) { throw 'installer did not bootstrap uv at the clean-user location' }
          & $uv --version

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install in-repo SDK, CLI, and dev tools
        # The dependency-name substitution below is bash; windows-latest
        # otherwise defaults to pwsh. Git bash ships on the Windows runner.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ..
          pip install -e .
          pip install $(python -c "import tomllib; g = tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['group']['dev']['dependencies']; print(' '.join(k for k in g if k.lower() != 'python'))")

      # Exercise the PowerShell installer's failure contract on a real Windows
      # runner: a stubbed `mammoth` that fails `skill install` must make the
      # installer exit nonzero. pwsh is present on windows-latest, so the
      # guarded ps1 test runs here. No network or admin required.
      - name: Installer contract tests (pwsh)
        run: pytest tests/installer -q -p no:cacheprovider -m "not live"

  installer-macos:
    # Native macOS installation gate. The CLI advertises macOS support, so the
    # POSIX installer must be exercised on real macOS runners, not only Linux.
    # macos-latest is Apple Silicon (arm64); macos-13 is the last Intel
    # (x86_64) image — both native macOS architectures are covered.
    name: installer (macos, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-13]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Local install with a CLEAN uv bootstrap: strip every uv from PATH so
      # the POSIX installer must download and pin its own uv
      # (UV_PINNED_VERSION) rather than reuse a preinstalled one, then --local
      # builds the mammoth-io + mammoth-cli wheels from this checkout and
      # installs them (third-party deps still resolve from PyPI). The mammoth
      # shim lands in the explicit UV_TOOL_BIN_DIR so the smoke checks can find
      # it deterministically.
      - name: Clean uv bootstrap + local install (smoke)
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/local-bin
          UV_TOOL_DIR: ${{ runner.temp }}/local-tools
        run: |
          set -eu
          # Build a uv-free PATH.
          newpath=""
          IFS=":"
          for d in $PATH; do
            [ -n "$d" ] || continue
            [ -x "$d/uv" ] && continue
            newpath="${newpath:+$newpath:}$d"
          done
          IFS=" "
          export PATH="$newpath"
          if command -v uv >/dev/null 2>&1; then
            echo "::error::failed to create a uv-free PATH for the clean bootstrap"
            exit 1
          fi
          ./installers/mammoth-install.sh --local --cli-only --no-modify-path
          mammoth="$UV_TOOL_BIN_DIR/mammoth"
          [ -x "$mammoth" ] || { echo "::error::mammoth not installed at $mammoth"; exit 1; }
          "$mammoth" --version
          "$mammoth" schema list --output json > /dev/null

      # Release-style install: assemble the installer exactly as
      # cli-release.yml does (substituting the embedded __CLI_VERSION__), then
      # run that shipped script. It installs --local because the mammoth-io
      # 0.6.0 / mammoth-cli release is not on PyPI yet (see the R12 gate in
      # cli-release.yml); the PyPI path activates once those are published.
      - name: Release-style install (smoke)
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/release-bin
          UV_TOOL_DIR: ${{ runner.temp }}/release-tools
        run: |
          set -eu
          staging="${{ runner.temp }}/release-assets"
          mkdir -p "$staging"
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")"
          sed "s/__CLI_VERSION__/${version}/g" installers/mammoth-install.sh > "$staging/mammoth-install.sh"
          chmod +x "$staging/mammoth-install.sh"
          # The assembled script runs from a staging dir, so point --local at
          # this CLI checkout explicitly ($PWD is the mammoth-cli directory).
          "$staging/mammoth-install.sh" --local="$PWD" --cli-only --no-modify-path
          mammoth="$UV_TOOL_BIN_DIR/mammoth"
          [ -x "$mammoth" ] || { echo "::error::mammoth not installed at $mammoth"; exit 1; }
          "$mammoth" --version
          "$mammoth" schema list --output json > /dev/null

  docs:
    name: docs (generation, STE, Vale, links)
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.15.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install in-repo SDK, CLI, and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ..
          pip install -e .
          pip install $(python -c "import tomllib; g = tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['group']['dev']['dependencies']; print(' '.join(k for k in g if k.lower() != 'python'))")

      - name: Install Vale (pinned)
        working-directory: .
        run: |
          set -eu
          url="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/vale.tar.gz"
          tar -xzf "$tmp/vale.tar.gz" -C "$tmp"
          sudo install -m 0755 "$tmp/vale" /usr/local/bin/vale
          vale --version

      - name: Documentation generation drift
        run: python scripts/gen_docs.py --check

      - name: Sentence-length checker (STE)
        run: python scripts/check_ste.py docs/*.md

      - name: Vale house style
        run: vale docs/

      - name: Link validation
        run: python scripts/check_links.py docs
