name: MCP Release

# Publishes the mammoth-mcp server to PyPI on its own tag, and NOTHING else.
#
# Single-publication-path design: each of the three distributions in this
# monorepo is published by EXACTLY ONE tag-triggered workflow, and none is
# triggered by a GitHub `release: published` event.
#   - mammoth-io  -> sdk-release.yml   (tag: sdk-v*)
#   - mammoth-cli -> cli-release.yml   (tag: cli-v*, also cuts a GitHub Release)
#   - mammoth-mcp -> publish.yml       (tag: mcp-v*)  <-- this file
#
# This file used to trigger on `release: published` and publish BOTH mammoth-io
# and mammoth-mcp with MUTABLE action tags. Because cli-release.yml creates a
# GitHub Release, that gave the SDK a second, unpinned publication path and
# re-published MCP on every CLI release. It is now a tag-triggered, MCP-only,
# SHA-pinned mirror of sdk-release.yml. It runs ONLY when an authorized
# maintainer pushes an `mcp-vX.Y.Z` tag. Do not push an `mcp-v*` tag without
# separate release authorization. The invariant is enforced by
# mammoth-cli/tests/contract/test_single_publication_path.py.
on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read

defaults:
  run:
    working-directory: mammoth-mcp

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Derive version from tag
        id: version
        working-directory: .
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # The tag must be mcp-v<SemVer>. Require the exact prefix, then validate
          # the remainder as STRICT SemVer: MAJOR.MINOR.PATCH with optional
          # -prerelease and +build metadata, fully anchored. The old glob
          # `[0-9]*.[0-9]*.[0-9]*` accepted non-SemVer such as `1.2.3.4` or
          # `1.2.3abc`; this regex does not, so a malformed tag fails fast before
          # any build or publish step runs. (Mirrors sdk-release.yml.)
          case "$tag" in
            mcp-v*) : ;;
            *) echo "::error::tag '$tag' is not mcp-vX.Y.Z"; exit 1 ;;
          esac
          version="${tag#mcp-v}"
          # Strict-SemVer check via the one shared validator used by all three
          # release workflows (mammoth-cli/scripts/validate_semver.sh), so the
          # rule lives in exactly one place. This step runs from the repo root
          # (working-directory: .).
          bash mammoth-cli/scripts/validate_semver.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject version matches tag
        run: |
          set -eu
          declared="$(poetry version --short)"
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::pyproject version '$declared' != tag version '${{ steps.version.outputs.version }}'"
            exit 1
          fi

      # Real quality gates before publishing. `poetry install` provisions the
      # runtime deps and the in-repo mammoth-io SDK (declared as a path
      # dependency), so the tests exercise the code exactly as it will ship.
      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install test tooling (mammoth-mcp declares no dev group)
        run: |
          set -eu
          # mammoth-mcp declares no dev dependency group, and its unit tests use
          # @pytest.mark.asyncio, which needs pytest-asyncio. Neither pytest nor
          # pytest-asyncio is declared by the package, so install them here,
          # pinned, so the gate is deterministic.
          poetry run pip install "pytest>=8,<9" "pytest-asyncio>=0.24,<0.25"

      - name: Tests
        # The unit suites run offline. The e2e/oauth suites self-skip when
        # MCP_SERVER_URL and the Mammoth credentials are absent (see
        # tests/conftest.py), so no live server is required in CI. mypy is NOT
        # run: mammoth-mcp configures no mypy settings (no [tool.mypy], no
        # mypy.ini); inventing config here would be out of scope.
        run: poetry run pytest tests/ -q -p no:cacheprovider

      - name: Build distribution
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: poetry build --output dist

      # Install the freshly built wheel into a throwaway clean venv and smoke it,
      # mirroring the build-and-verify discipline of cli-release.yml. The wheel's
      # mammoth-io requirement is satisfied from a local wheelhouse holding the
      # in-repo SDK wheel (PyPI does not yet carry the matching SDK release), so
      # the first-party dependency needs no network; third-party deps resolve
      # from PyPI.
      #
      # KNOWN PREREQUISITE (surfaced by this gate): mammoth-mcp/pyproject.toml
      # declares mammoth-io as a path dependency (`{path = "..", develop =
      # true}`), so `poetry build` emits `mammoth-io @ file:///<checkout>` into
      # the wheel metadata. PyPI rejects direct-URL dependencies, and this direct
      # reference makes the clean-venv install non-portable across machines.
      # Before mammoth-mcp can actually be published, replace that path
      # dependency with a PyPI version spec (as mammoth-cli does with
      # `mammoth-io = ">=0.6.0,<0.7"`), installing the in-repo SDK editable first
      # for local dev.
      - name: Clean-venv install of the built wheel + smoke
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          wheelhouse="$(mktemp -d)"
          ( cd .. && poetry build --format wheel --output "$wheelhouse" )
          venv="${RUNNER_TEMP}/mcp-smoke"
          python -m venv "$venv"
          "$venv/bin/pip" install --upgrade pip
          "$venv/bin/pip" install --find-links "$wheelhouse" dist/mammoth_mcp-*.whl
          "$venv/bin/python" <<'PY'
          import os
          import mammoth_mcp
          from importlib.metadata import entry_points, version
          expected = os.environ["EXPECTED_VERSION"]
          assert mammoth_mcp.__version__ == expected, mammoth_mcp.__version__
          assert version("mammoth-mcp") == expected, "installed wheel version mismatch"
          # Import-time smoke only: main() starts the server and must NOT be run.
          from mammoth_mcp.server import main
          assert callable(main), "console entrypoint target not callable"
          names = {e.name for e in entry_points(group="console_scripts")}
          assert "mammoth-mcp" in names, "mammoth-mcp console script not registered"
          print("mcp clean-venv smoke ok:", mammoth_mcp.__version__)
          PY

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-dist
          path: mammoth-mcp/dist/
          if-no-files-found: error

  publish-pypi:
    name: publish mammoth-mcp to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mcp-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
