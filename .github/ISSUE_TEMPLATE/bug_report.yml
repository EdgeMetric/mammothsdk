name: Bug report
description: Something in the SDK, CLI or MCP server does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [mammoth-io (SDK), mammoth-cli, mammoth-mcp-server]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show mammoth-io` or `mammoth --version`.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact command or code and the full error output. Redact API keys, tokens and customer data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
