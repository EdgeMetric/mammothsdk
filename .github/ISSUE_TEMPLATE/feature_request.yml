name: Feature request
description: Suggest a new capability or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [mammoth-io (SDK), mammoth-cli, mammoth-mcp-server]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not just the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
