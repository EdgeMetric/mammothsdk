# nginx in front of the Mammoth MCP server.
#
# A client reaches the server at one host. Every path below must arrive
# unchanged: the metadata names this host, and a client follows it.
#
#   /mcp                                       the MCP endpoint
#   /.well-known/oauth-protected-resource/mcp  where a client learns where to sign in
#   /upload                                    the page a user drops a file on
#
# The Mammoth host needs one rule too; the second server block below has it.

server {
    listen 443 ssl;
    server_name mcp.example.com;

    # ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    # The upload page takes files of up to 50 MB.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8270;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A tool call waits for Mammoth, for up to 90 seconds.
        proxy_read_timeout 120s;
    }
}

# The Mammoth host, where the web app and the API are served.
#
# A client reads the MCP server's metadata, finds Mammoth's authorization
# server there, and then asks that server for ITS metadata. For an issuer with
# a path, such as `https://app.example.com/api/v2`, RFC 8414 puts the metadata
# at `/.well-known/oauth-authorization-server/api/v2` — the path goes AFTER the
# well-known part. apiv2 serves the document at its own path instead, so one
# rule has to join the two. Without it no client can start the sign-in.
server {
    listen 443 ssl;
    server_name app.example.com;

    location = /.well-known/oauth-authorization-server/api/v2 {
        proxy_pass http://127.0.0.1:8260/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ... the rules this host already has: the web app, /api/v2, and the rest.
}
