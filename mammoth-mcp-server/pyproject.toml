[project]
name = "mammoth-mcp-server"
version = "0.2.0"
description = "MCP server for Mammoth Analytics: an AI client explores, transforms and exports data as the signed-in user"
authors = [{name = "Mammoth Analytics", email = "support@mammoth.io"}]
license = "LicenseRef-Proprietary"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mammoth-io (>=0.8.35,<0.9)",
    "mcp (>=2.2.0,<3)",
    "pydantic (>=2.12.5,<3)",
    "redis (>=5,<8)",
    "cryptography (>=48.0.1,<50)",
    "uvicorn (>=0.34)",
    "python-multipart (>=0.0.18)",
]
urls = {homepage = "https://mammoth.io", repository = "https://github.com/EdgeMetric/mammothsdk"}
scripts.mammoth-mcp-server = "mammoth_mcp_server.app:main"

[dependency-groups]
dev = [
    "pytest (>=8,<10)",
    "pytest-asyncio (>=0.24)",
    "mypy (>=1.11)",
    "ruff (>=0.6)",
    "black (>=24)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mammoth_mcp_server"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["mammoth_mcp_server"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["UP007", "UP040", "UP046", "UP047", "SIM108", "E501", "N818"]
