[project]
name = "mammoth-cli"
version = "2.0.9"
description = "Command-line interface for the Mammoth Analytics platform"
authors = [{name = "Mammoth Analytics", email = "support@mammoth.io"}]
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mammoth-io (>=0.7.3,<0.8)",
    "typer (>=0.27,<0.28)",
    "rich (>=15,<16)",
    "platformdirs (>=4.10,<5)",
    "tomlkit (>=0.15.1,<0.16)",
    "keyring (>=25.7,<26)",
    "PyYAML (>=6,<7)",
    "pydantic (>=2.13,<3)",
    "jsonschema (>=4.20)",
]
urls = {homepage = "https://mammoth.io", repository = "https://github.com/EdgeMetric/mammothsdk"}
scripts.mammoth = "mammoth_cli.__main__:main"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.hatch.build.targets.wheel]
packages = ["mammoth_cli"]
force-include = {"spec/openapi/openapi.json" = "spec/openapi/openapi.json", "spec/openapi/metadata.json" = "spec/openapi/metadata.json", "spec/manifests" = "spec/manifests"}
# Twine 6.x and current PyPI tooling accept Core Metadata 2.4 (including the
# PEP 639 License-Expression field); 2.5 is not yet accepted by Twine's
# distribution validator.
core-metadata-version = "2.4"

[dependency-groups]
dev = [
    "pytest (>=8,<10)",
    "mypy (>=1.11)",
    "ruff (>=0.6)",
    "black (>=24)",
    "datamodel-code-generator (>=0.69,<0.70)",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["mammoth_cli", "spec/openapi/openapi.json", "spec/openapi/metadata.json", "spec/manifests"]
core-metadata-version = "2.4"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["mammoth_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: guarded live tests that require a dedicated test tenant (deselect with -m 'not live')",
    "subprocess: tests that spawn the installed executable or module entry point",
]
# Import test files by their full paths so equally named realcode and unit
# modules can be collected together by the documented ``pytest tests/`` command.
addopts = "--import-mode=importlib -m 'not live'"
