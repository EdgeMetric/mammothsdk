[tool.poetry]
name = "mammoth-cli"
version = "1.0.0"
description = "Command-line interface for the Mammoth Analytics platform"
authors = ["Mammoth Analytics <support@mammoth.io>"]
readme = "README.md"
license = "Proprietary"
homepage = "https://mammoth.io"
repository = "https://github.com/EdgeMetric/mm-pysdk"
packages = [{ include = "mammoth_cli" }]
include = [
    "mammoth_cli/py.typed",
    "mammoth_cli/bundled_skill/**/*",
    # The reviewed spec data lives beside the package in the repo. Poetry only
    # ships sibling-of-package files in the wheel when the wheel format is
    # requested explicitly; without this the installed CLI can build no command
    # tree (only --version works) because the manifests are absent.
    { path = "spec/openapi/openapi.json", format = ["sdist", "wheel"] },
    { path = "spec/openapi/metadata.json", format = ["sdist", "wheel"] },
    { path = "spec/manifests/**/*", format = ["sdist", "wheel"] },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
# The CLI must compose with a published SDK, never a repo-local file URL.
mammoth-io = ">=0.6.0,<0.7"
typer = ">=0.27,<0.28"
rich = ">=15,<16"
platformdirs = ">=4.10,<5"
tomlkit = ">=0.15.1,<0.16"
keyring = ">=25.7,<26"
PyYAML = ">=6,<7"
pydantic = ">=2.13,<3"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
mypy = ">=1.11"
ruff = ">=0.6"
black = ">=24"
datamodel-code-generator = ">=0.69,<0.70"
jsonschema = ">=4.20"
types-PyYAML = "*"

[tool.poetry.scripts]
mammoth = "mammoth_cli.__main__:main"

[build-system]
requires = ["poetry-core>=2.4,<3"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["mammoth_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: guarded live tests that require a dedicated test tenant (deselect with -m 'not live')",
    "subprocess: tests that spawn the installed executable or module entry point",
]
# Import test files by their full paths so equally named realcode and unit
# modules can be collected together by the documented ``pytest tests/`` command.
addopts = "--import-mode=importlib -m 'not live'"
