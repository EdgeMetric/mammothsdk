# Vale configuration for the Mammoth CLI documentation house style.
# Pin Vale 3.15.1 in CI. The house profile is inspired by ASD-STE100
# (https://www.asd-ste100.org/); it does not copy that dictionary or claim
# compliance or certification.

StylesPath = styles
MinAlertLevel = warning

Vocab = Mammoth

[*.md]
BasedOnStyles = MammothSTE
# Exclude inline code, flags, environment/constant names, URLs, and paths from
# lexical replacement; skip fenced code blocks entirely.
TokenIgnores = (\x60[^\x60]+\x60), (--[a-z][a-z-]+), (\b[A-Z][A-Z0-9_]+\b), (https?://\S+)
BlockIgnores = (?s) *(\x60{3}.*?\x60{3})

[*.txt]
BasedOnStyles = MammothSTE
TokenIgnores = (\x60[^\x60]+\x60), (--[a-z][a-z-]+), (\b[A-Z][A-Z0-9_]+\b), (https?://\S+)

# Generated corpora are machine-rendered from the manifests (their "headings"
# are literal command family tokens); the generator, not Vale, owns their shape.
[docs/reference/commands.md]
BasedOnStyles =

[docs/llms*.txt]
BasedOnStyles =
