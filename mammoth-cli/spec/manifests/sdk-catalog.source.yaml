notes_on_dispositions:
- 'DatasetsAPI.bulk_delete: "the SDK sends collection DELETE without target IDs. The command is forbidden
  until OpenAPI proves exact targets and a typed SDK request carries them" (BLOCKED[B08], and doc 09 states
  it "MUST NOT be exposed").'
- 'ProjectsAPI.bulk_update: "BLOCKED[B02]" — accepts an unconstrained dictionary; reserved but not registered.'
- 'DatasetsAPI.create: "BLOCKED[B06]" — creation type is a free string and dataset_spec is arbitrary;
  reserved but not registered.'
- 'DatasetsAPI.update / DatasetsAPI.bulk_update: "BLOCKED[B07]" — raw patch operations include rename,
  refresh, column changes, reattach, and deletion; reserved but not registered, and a benign command must
  not smuggle deletion.'
- 'DataviewsAPI.update / conditional_format_create / conditional_format_update: "BLOCKED[B09]" — dictionaries
  are arbitrary; reserved but not registered until strict public request models exist.'
- 'DataviewsAPI.draft_mode: "BLOCKED[B12]" — "DataviewsAPI docstrings say enter|commit|discard, DraftCommand
  uses enter|submit|discard|exit, and this API takes free text. Replace it with the shared enum and typed
  server state."'
- 'UserProfileAPI.update / update_preferences / ActivityLogsAPI.list: "BLOCKED[B17 VARIADIC_INPUT_UNTYPED]"
  — fields are **Any; "Generate strict OpenAPI-backed request models; unrecognized fields must fail before
  transport."'
- 'UserProfileAPI.change_password: "BLOCKED[B18]" — "absent from the public OpenAPI. It remains reserved
