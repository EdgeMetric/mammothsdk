manifest_schema_version: 1
commands:
- command_id: project.bulk-delete
  output_schema: {ref: WriteResult}
  readback:
    command: project.list
    ids: {}
    kind: object
- command_id: project.bulk-update
  output_schema: {ref: WriteResult}
  known_restrictions: Release contract is ProjectsPatch (role add/replace/remove across projects). The
    CLI requires every patches[].value item to name a project_id and the confirmation names those ids;
    a body that names no project is refused before dispatch. Not verified live.
  readback:
    command: project.list
    ids: {}
    kind: object
- command_id: project.check
  output_schema:
    ref: ProjectCheck
  command_path: project check
  disposition: command
  alias_of: null
  operation_ids: []
  positionals:
  - name: project_id
    type: int
    required: false
    metavar: PROJECT_ID
    falls_back_to_field: null
    help: ID of the project to act on; defaults to the active project.
  - name: dataset_id
    type: int
    required: false
    metavar: DATASET_ID
    falls_back_to_field: null
    help: Check only this dataset (its first view unless VIEW_ID is given); no other dataset or dashboard
      is read.
  - name: view_id
    type: int
    required: false
    metavar: VIEW_ID
    falls_back_to_field: null
    help: Check this view of DATASET_ID instead of its first (most recent) one.
  options: []
  sdk_symbol: mammoth_cli.commands.project.project_check
  sdk_conversion: Call mammoth_cli.commands.project.project_check with validated request fields.
  request_model: ProjectCheckRequest
  result_model: ProjectCheckResult
  mutation_class: read
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_read_only
  live_test: null
  live_exemption_reason: Local composite over already-covered dataset, view and dashboard reads.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth project check --help
  agent_example: mammoth project check 123 456
  unit_tests:
  - UT-PROJECT-CHECK
  contract_tests:
  - CT-PROJECT-CHECK-HUMAN
  - CT-PROJECT-CHECK-JSON
  - CT-PROJECT-CHECK-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: Reads the first view of each dataset (the one uploads and the playbooks use) and
    one data page per view, six resources at a time. `resources` has one status row per dataset and dashboard
    with its freshness (in_sync, out_of_sync or running, with data_updated_at) kept apart from its data
    quality (warning count), or the error that stopped its check. Given DATASET_ID it reads only that
    dataset's first view and skips the dashboards; also given VIEW_ID it reads that view instead. Every
    status row names the view_id and view_name it checked, so compare it with the view the work was on.
  reviewed_by: primary
- command_id: project.checkpoint.list
  output_schema: openapi
- command_id: project.create
  output_schema: {ref: WriteResult}
  readback:
    command: project.get
    ids:
      project_id: result.id
    kind: object
- command_id: project.ensure
  output_schema:
    allOf:
    - {$ref: '#/$defs/WriteResult'}
    - type: object
      required: [created, duplicates]
      properties:
        created: {type: boolean}
        duplicates: {type: array}
  command_path: project ensure
  disposition: command
  alias_of: null
  operation_ids:
  - GetProject
  - CreateProject
  positionals:
  - name: name
    type: str
    required: false
    metavar: NAME
    falls_back_to_field: name
    help: Exact project name to find or create; or pass it via the 'name' input field.
  options: []
  sdk_symbol: mammoth_cli.commands.project.project_ensure
  sdk_conversion: Call mammoth_cli.commands.project.project_ensure with validated request fields.
  request_model: ProjectEnsureRequest
  result_model: ProjectEnsureResult
  mutation_class: benign_mutation
  edits_target: false
  undo:
    strategy: "manual"
    command: "project.delete"
    note: "It may have found an existing project instead of making one: check before deleting."
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_disposable_project
  live_test: null
  live_exemption_reason: Local composite over project list and project create; idempotent by exact name.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth project ensure --help
  agent_example: mammoth project ensure 'Revenue report'
  unit_tests:
  - UT-PROJECT-ENSURE
  contract_tests:
  - CT-PROJECT-ENSURE-HUMAN
  - CT-PROJECT-ENSURE-JSON
  - CT-PROJECT-ENSURE-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: Matches the exact, case-sensitive name; several projects with the same name resolve
    to the lowest id and the rest are listed under 'duplicates'. Creating a project is a benign mutation;
    sweep with 'project delete ID --yes --confirm ID'.
  reviewed_by: primary
  readback:
    command: project.get
    ids:
      project_id: result.project_id
    kind: object
- command_id: project.data-check.list
  output_schema: openapi
- command_id: project.delete
  output_schema:
    ref: WriteResult
  mutation_class: high_impact
  confirmation: confirm_target
  agent_example: mammoth project delete 123 --yes --confirm 123
  readback:
    command: project.list
    ids: {}
    kind: object
- command_id: project.get
  output_schema:
    ref: ProjectGet
  known_restrictions: Reads one project by id. A token limited to one project can read only that project.
- command_id: project.list
  output_schema: openapi
  known_restrictions: 'B01 FIRST_PAGE_ONLY: no offset/cursor continuation proven yet.'
- command_id: project.memory.list
  output_schema:
    ref: ProjectMemoryList
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: No automated disposable-project fixture wired into tests/live yet for this command.
  known_restrictions: The saved preferences are the caller's own, per project, oldest first; the in-app
    agent reads them at the start of every turn. Remove one by its zero-based position in this list.
- command_id: project.memory.add
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: project.memory.remove
    note: 'Run it with the index of the memory it added (see `project memory list`); the add''s text is not what the removal takes.'
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: No automated disposable-project fixture wired into tests/live yet for this command.
  known_restrictions: 'Save only a preference the user stated for how the agent works or shows things
    (at most 20, each at most 200 characters); never data, results or secrets. The in-app agent applies
    them in every later turn in this project. A rule about what a board''s data means (for example, Returned
    orders are refunds) belongs to that board: dashboard context create.'
  readback:
    command: project.memory.list
    ids:
      project_id: positional.0
    kind: object
- command_id: project.memory.remove
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: project.memory.add
    note: 'Run it with the text of the memory it removed (--input); the removal did not keep it.'
  confirmation: prompt_or_yes
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: No automated disposable-project fixture wired into tests/live yet for this command.
  agent_example: 'mammoth project memory remove 123 --input ''{"index": 1}'' --yes'
  known_restrictions: index is the zero-based position from project memory list; use it when the user
    asks to forget a preference.
  readback:
    command: project.memory.list
    ids:
      project_id: positional.0
    kind: object
- command_id: project.needs-attention
  output_schema:
    ref: ProjectNeedsAttention
  mutation_class: read
  acceptance_evidence: live_read_only
  known_restrictions: 'The rows of the Monitor Needs Attention tab for one project (the app has no workspace-wide
    list): pipeline_error, pending_pipeline, pending_data, checkpoint (needs approval), data_check (failed),
    each with view_id and the owning dataset_id, and needs_input (a file or dataset waiting for a person;
    action is unstructured_rows, ambiguous_date_format, password_required, sheet_selection_required or
    schema_mismatch); datasets lists each affected dataset once with its view_ids. Pending retentions
    are not returned by the API and are not included. To delete the datasets behind the views, take dataset_id
    from datasets and run dataset delete or dataset bulk-delete (confirm first).'
  readback:
    command: project.needs-attention
    ids: {}
    kind: object
  unset:
  - edits_target
- command_id: project.pending-changes
  output_schema: openapi
- command_id: project.publish-credentials
  output_schema: openapi
- command_id: project.resource-dependencies
  output_schema: openapi
- command_id: project.resource-dependencies.update
  output_schema:
    ref: WriteResult
  known_restrictions: Changes the resources the project declares it depends on; views and dashboards that
    read through a removed dependency can stop resolving data. Read the current set first (`project resource-dependencies`).
    Needs --yes and --confirm PROJECT_ID.
  readback:
    command: project.resource-dependencies
    ids:
      project_id: positional.0
    kind: object
- command_id: project.resource-status
  output_schema:
    ref: ProjectResourceStatus
- command_id: project.sample-flow
  output_schema:
    ref: WriteResult
  readback:
    command: job.get
    ids:
      job_id: result.job_id
    kind: delivery
- command_id: project.update
  output_schema:
    ref: WriteResult
  readback:
    command: project.get
    ids:
      project_id: positional.0
    kind: object
- command_id: project.user.add
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: project.user.remove
    note: 'Run it with the same user_ids, --yes and --confirm. The add''s role is not part of the removal, so the journal cannot reuse the add''s input as it is.'
  known_restrictions: 'B03 PROJECT_USER_ID_ROLE_UNTYPED. role is required, and a user who is already a
    project member is refused (the backend would replace that member''s role, demoting an admin); change
    roles with project user update. Takes existing workspace users'' ids. To add someone by email who
    is not in the workspace yet, use workspace user add with {"email_ids": [EMAIL], "projects": [{"project_id":
    PROJECT_ID, "role": ROLE}]}: it invites them as a workspace member with that project role, which is
    how a project gets a new person.'
  no_readback: no CLI read command exposes per-project user role assignments
- command_id: project.user.remove
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: project.user.add
    note: 'Run it with the same user_ids and a role for each: the removal did not keep the role the users had, so the journal cannot rebuild the add.'
  no_readback: no CLI read command exposes per-project user role assignments
- command_id: project.user.update
  output_schema:
    ref: WriteResult
  mutation_class: high_impact
  confirmation: yes_always
  known_restrictions: Changes one project member's role (role plus exactly one of user_id or invite_id);
    the person gains or loses access at once. Needs --yes.
  no_readback: no CLI read command exposes per-project user role assignments
- command_id: project.copy
  undo:
    strategy: manual
    command: project.delete
    note: 'Run it with the id of the copy (in its result), not the project that was copied.'
  output_schema:
    ref: WriteResult
  wait_policy: always_wait
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Backend route ships with this release; no disposable fixture runs it yet.
  known_restrictions: 'Creates a project: copies the datasets, views and pipelines of PROJECT_ID into
    a new project NAME, in one job the command waits for. Input fields: dataset_ids (copy only these;
    default all), include_dashboards (default false), exclude_data (default false, copies pipelines without
    rows). The result is project_id, dataset_map, view_map, skipped (what was left behind or still points
    outside the copy) and dashboards (dashboard_id, new_dashboard_id). Needs permission to create projects.
    Sweep with ''project delete ID --yes --confirm ID''.'
  readback:
    command: project.get
    ids:
      project_id: result.project_id
    kind: object
