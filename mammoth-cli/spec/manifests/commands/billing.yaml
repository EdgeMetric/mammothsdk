manifest_schema_version: 1
commands:
- command_id: billing.chargebee-plan
  output_schema: openapi
- command_id: billing.hosted-page
  known_restrictions: Creates a hosted billing page URL for object_type (for example change_plan). Nothing
    changes until someone completes the page. Needs --yes and --confirm TARGET (the refusal prints the
    exact target).
  no_readback: returns a one-time hosted checkout page URL; nothing persisted to read back
- command_id: billing.invoice.charge
  known_restrictions: Charges the workspace's open invoice to its saved payment method now; money moves.
    Read `billing stripe status` first. Needs --yes and --confirm TARGET (the refusal prints the exact
    target).
  readback:
    command: billing.invoice.list
    ids: {}
    kind: object
- command_id: billing.invoice.list
  output_schema:
    ref: BillingInvoiceList
  mutation_class: read
  confirmation: none
  pagination_policy: single_page
  agent_example: mammoth billing invoice list
  unset:
  - edits_target
- command_id: billing.stripe.cancel
  undo:
    strategy: manual
    command: billing.stripe.resume
    note: 'Run it for the same subscription. Whether a cancelled one can be resumed depends on the billing period, so the journal does not run a billing change for you.'
  known_restrictions: Cancels the workspace subscription at the billing provider. Read `billing stripe
    status` first; `billing stripe resume` reverses a pending cancel. Needs --yes and --confirm TARGET
    (the refusal prints the exact target).
  readback:
    command: billing.stripe.status
    ids: {}
    kind: object
- command_id: billing.stripe.checkout-url
  known_restrictions: Creates a checkout URL (success_url and cancel_url are required); nothing is charged
    until someone completes it. Needs --yes and --confirm TARGET (the refusal prints the exact target).
  no_readback: returns a one-time Stripe checkout URL; nothing persisted to read back
- command_id: billing.stripe.create
  readback:
    command: billing.stripe.status
    ids: {}
    kind: object
- command_id: billing.stripe.end-trial
  known_restrictions: Ends the workspace's free trial now and starts billing; the CLI cannot undo it.
    Needs --yes and --confirm TARGET (the refusal prints the exact target).
  readback:
    command: billing.stripe.status
    ids: {}
    kind: object
- command_id: billing.stripe.get
  output_schema: openapi
- command_id: billing.stripe.history
  output_schema: openapi
- command_id: billing.stripe.payment-method.delete
  output_schema:
    ref: WriteResult
  readback:
    command: billing.stripe.payment-method.list
    ids: {}
    kind: object
- command_id: billing.stripe.payment-method.list
  output_schema: openapi
- command_id: billing.stripe.payment-method.set-default
  output_schema:
    ref: WriteResult
  readback:
    command: billing.stripe.payment-method.list
    ids: {}
    kind: object
- command_id: billing.stripe.portal-url
  known_restrictions: Creates a customer-portal link that grants access to the workspace's billing; do
    not log or share it. Needs --yes and --confirm TARGET (the refusal prints the exact target).
  no_readback: returns a one-time Stripe customer-portal URL; nothing persisted to read back
- command_id: billing.stripe.preview-invoice
  output_schema: openapi
- command_id: billing.stripe.retry-payment
  known_restrictions: Retries the failed payment on the workspace's latest invoice; money moves if it
    succeeds. Needs --yes and --confirm TARGET (the refusal prints the exact target).
  readback:
    command: billing.stripe.status
    ids: {}
    kind: object
- command_id: billing.stripe.status
  output_schema: openapi
- command_id: billing.stripe.sync
  known_restrictions: Re-reads the subscription from the billing provider and overwrites Mammoth's copy
    of plan and status. Needs --yes and --confirm TARGET (the refusal prints the exact target).
  readback:
    command: billing.stripe.status
    ids: {}
    kind: object
- command_id: billing.stripe.upcoming-invoice
  output_schema: openapi
- command_id: billing.stripe.usage
  output_schema: openapi
- command_id: billing.subscription.get
  output_schema: openapi
- command_id: billing.subscription.update
  known_restrictions: 'Plans: storage 1 GB Free, 10 GB Starter, 50 GB Pro; users 1, 5, 10.'
  readback:
    command: billing.subscription.get
    ids: {}
    kind: object
- command_id: billing.stripe.resume
  undo:
    strategy: manual
    command: billing.stripe.cancel
    note: 'Run it for the same subscription. It is a billing change, so the journal does not run it for you.'
  known_restrictions: 'Keep the paid plan: clears a scheduled cancel-at-period-end downgrade, so the workspace
    does not move to Free at period end. With nothing scheduled the message says so and nothing changes.'
  readback:
    command: billing.stripe.status
    ids: {}
    kind: object
- command_id: billing.stripe.recheck-limits
  output_schema:
    ref: WriteResult
  mutation_class: benign_mutation
  confirmation: none
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Writes the live workspace's plan-limit lock; no disposable workspace fixture.
  agent_example: mammoth billing stripe recheck-limits
  known_restrictions: 'Recomputes which plan limits the workspace exceeds and stores the over-limit lock
    (over_limit_info: over_limit, items, advisory). Run it after deleting items; the lock clears once
    everything is under the limits. Safe to repeat.'
  no_readback: returns the recomputed over-limit report itself
- command_id: billing.stripe.storage.set
  known_restrictions: Sets the TOTAL purchased storage in GB (the plan's included storage or one of its
    storage options), not an increment. Inline-pricing plans only; the subscription is re-priced and the
    difference invoiced at once. Preview the cost first with billing stripe preview-invoice.
  readback:
    command: billing.stripe.usage
    ids: {}
    kind: object
- command_id: billing.stripe.held-change.cancel
  mutation_class: destructive
  known_restrictions: 'Irreversible: voids the unpaid invoice of the plan change the workspace is holding.
    If that invoice was already paid, the change is applied instead and the result says landed: true.
    Read `billing stripe held-change get` first; the confirmation and --dry-run name the held plan. Needs
    --yes and --confirm WORKSPACE_ID (the refusal prints the exact target).'
  readback:
    command: billing.stripe.held-change.get
    ids: {}
    kind: object
- command_id: billing.stripe.held-change.get
  output_schema: openapi
  known_restrictions: Answers not found when no plan change is waiting for payment.
