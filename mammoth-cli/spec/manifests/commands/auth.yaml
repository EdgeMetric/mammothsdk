manifest_schema_version: 1
commands:
- command_id: auth.connected-apps.list
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read-only; checked live on the koyal profile, not in the automated live suite.
  unit_tests:
  - test_connected_apps_lists_the_signed_in_users_grants
  contract_tests:
  - test_the_command_is_registered_and_reachable_from_the_cli
  known_restrictions: Read-only. The apps the signed-in user has authorised; each id is the grant id that
    auth connected-apps revoke takes.
  unset:
  - options
- command_id: auth.connected-apps.revoke
  live_exemption_reason: High-impact access change without a disposable fixture; checked by dry-run only.
  unit_tests:
  - test_revoke_connected_app_deletes_that_grant_on_an_empty_204
  contract_tests:
  - test_the_command_is_registered_and_reachable_from_the_cli
  known_restrictions: 'Exact grant-ID confirmation (--yes --confirm ID). Disconnects the app: its tokens
    stop working for this user.'
  readback:
    command: auth.connected-apps.list
    ids: {}
    kind: object
  unset:
  - options
- command_id: auth.login
  agent_example: mammoth auth login
  readback:
    command: auth.status
    ids: {}
    kind: object
- command_id: auth.logout
  readback:
    command: auth.status
    ids: {}
    kind: object
- command_id: auth.status
  output_schema:
    ref: AuthStatus
