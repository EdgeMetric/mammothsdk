manifest_schema_version: 1
commands:
- command_id: user.avatar.delete
  known_restrictions: Removes the signed-in user's profile picture; upload it again to restore it. Needs
    a prompt or --yes.
  readback:
    command: user.get
    ids: {}
    kind: object
- command_id: user.avatar.upload
  readback:
    command: user.get
    ids: {}
    kind: object
- command_id: user.delete-account
  known_restrictions: Deletes the signed-in user's account for good. Pass validate_only to check what
    would be removed first. Needs --yes and --confirm WORKSPACE_ID (the refusal prints it).
  no_readback: deletes the caller's own account; no parent listing exists and the account can no longer
    be read afterward
- command_id: user.get
  output_schema: openapi
- command_id: user.preference.get
  output_schema: openapi
- command_id: user.preference.update
  known_restrictions: 'Body is the release {"patch": [{"op", "path", "value"}]} list; the CLI does not
    validate preference paths (observed key GLOBAL.PREFERENCES.TOP_TABS). Not verified live.'
  readback:
    command: user.preference.get
    ids: {}
    kind: object
- command_id: user.update
  mutation_class: benign_mutation
  confirmation: none
  live_exemption_reason: Account or workspace mutation without a disposable fixture.
  agent_example: 'mammoth user update --input ''{"first_name": "Jane"}'''
  known_restrictions: null
  readback:
    command: user.get
    ids: {}
    kind: object
