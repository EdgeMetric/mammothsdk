- command_id: dataset.create
  command_path: dataset create
  disposition: command
  alias_of: null
  operation_ids:
  - CreateDatasets
  positionals: []
  options: []
  sdk_symbol: mammoth.api.datasets.DatasetsAPI.create
  sdk_conversion: Call mammoth.api.datasets.DatasetsAPI.create with validated request fields.
  request_model: DatasetCreateRequest
  result_model: DatasetCreateResult
  mutation_class: benign_mutation
  edits_target: false
  confirmation: none
  wait_policy: always_wait
  pagination_policy: none
  acceptance_evidence: live_disposable_project
  readback:
    command: view.data.get
    ids:
      dataset_id: result.dataset_id
    kind: data
  live_test: LT-DATASET-CREATE
  live_exemption_reason: null
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth dataset create --help
  agent_example: 'mammoth dataset create --input ''{"dataset_spec": {"url": "https://sampledata.mammoth.io/Multi-Store_Retail_Sales.csv"},
    "ds_creation_type": "weburl"}'''
  unit_tests:
  - UT-DATASET-CREATE
  contract_tests:
  - CT-DATASET-CREATE-HUMAN
  - CT-DATASET-CREATE-JSON
  - CT-DATASET-CREATE-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: 'ds_creation_type is freeform and dataset_spec is arbitrary, so variants beyond the documented path are not qualified. Retained live evidence supports ds_creation_type=weburl with dataset_spec.url; the CLI command waits for the raw SDK job and returned ready for five OWID URL imports. Re-read returned dataset/view IDs and delete only IDs created by this task. A weburl dataset is a one-time copy that keeps no source details to refresh from, so automation''s run_data_retrieval task cannot refresh it (only a cloud-connected dataset can be refreshed); say so rather than scheduling a refresh for it. The result''s name is the dataset''s real name; when the requested name was taken the server adds a suffix, and requested_name and note say so. Use name, not the name you asked for. To copy a dataset as a new independent one: {"ds_creation_type": "clone", "dataset_spec": {"ds_name": NEW_NAME, "source_ds_id": ID, "clone_dataview_ids": [DEFAULT_VIEW_ID], "exclude_data": false}}, DEFAULT_VIEW_ID being the id in dataset''s `default_view` from view list (other views only when asked); an empty clone_dataview_ids is refused here because it makes a blank view. A clone waits and returns the new dataset_id; never use view export dataset for a plain copy, which leaves a live export on the source. A weburl import names the dataset after the downloaded file: follow it with dataset rename to the name the user picked. To import a file from an SFTP server (or another file connector) as a new dataset: connector connection create sftp, then {"ds_creation_type": "cloud", "dataset_spec": {"connector_key": "sftp", "connection_key": KEY, "query_properties": {"ds_name": NAME, "file_path": PATH_ON_SERVER}}}; the recipe is recipes/file-import.md.'
  reviewed_by: primary
