manifest_schema_version: 1
commands:
- command_id: dataset.batch-data
  output_schema:
    ref: OpenObject
  operation_ids: []
- command_id: dataset.broken-rows.list
  output_schema:
    ref: DatasetBrokenRows
  operation_ids: []
  known_restrictions: Returns the first 100 lines the upload could not parse, each with its line number,
    upload (batch_id) and why it does not fit the columns; row_count is the total. A dataset not made
    from a file upload has none.
- command_id: dataset.broken-rows.resolve
  output_schema:
    ref: WriteResult
  readback:
    command: dataset.broken-rows.list
    ids:
      dataset_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Needs a file upload with ragged rows on a test server; not yet run live.
  known_restrictions: 'op "add" takes each corrected line (line_num, batch_id and the original line from
    dataset broken-rows list, edited so its column count matches) into the dataset; op "remove" discards
    the lines for good. Returns a job: run job wait on it, then read broken-rows list (row_count 0 and
    dataset status ready mean it is finished). Confirm with the user first, and say that discarded lines
    do not come back.'
- command_id: dataset.bulk-delete
  output_schema: {ref: BulkDeleteResult}
  readback:
    command: dataset.list
    ids: {}
    kind: object
  known_restrictions: Deletes every listed dataset for good and cannot be undone. A dataset that another
    view uses as a lookup or join source is kept, and the result says so. List them first (`dataset list`).
    Needs a prompt or --yes.
- command_id: dataset.bulk-update
  output_schema: {ref: WriteResult}
  readback:
    command: dataset.list
    ids: {}
    kind: object
- command_id: dataset.create
  output_schema:
    ref: WriteResult
  readback:
    command: view.data.get
    ids:
      dataset_id: result.dataset_id
    kind: data
  known_restrictions: 'ds_creation_type=weburl (dataset_spec.url), clone, or cloud (a file, REST API or
    database query from a connection); the command waits for the job and returns the new dataset_id. A
    weburl dataset keeps its link and can be refreshed on demand (dataset refresh DATASET_ID --yes, or
    Refresh from URL in the web app; a single CSV only), but never on a schedule: automation''s run_data_retrieval
    task cannot refresh it (only a cloud-connected dataset can be refreshed); for a scheduled pull from
    a URL use the REST API connector. Say so rather than scheduling a refresh for it. The result''s name
    is the dataset''s real name; when the requested name was taken the server adds a suffix, and requested_name
    and note say so. Use name, not the name you asked for. To copy a dataset as a new independent one:
    {"ds_creation_type": "clone", "dataset_spec": {"ds_name": NEW_NAME, "source_ds_id": ID, "clone_dataview_ids":
    [DEFAULT_VIEW_ID], "exclude_data": false}}, DEFAULT_VIEW_ID being the id in dataset''s `default_view`
    from view list (other views only when asked); an empty clone_dataview_ids is refused here because
    it makes a blank view. A clone waits and returns the new dataset_id; never use view export dataset
    for a plain copy, which leaves a live export on the source. A weburl import names the dataset after
    the downloaded file: follow it with dataset rename to the name the user picked. To import a file from
    an SFTP server (or another file connector) as a new dataset: connector connection create sftp, then
    {"ds_creation_type": "cloud", "dataset_spec": {"connector_key": "sftp", "connection_key": KEY, "query_properties":
    {"ds_name": NAME, "file_path": PATH_ON_SERVER, "data_pull_file": "Pull same file"}}}. data_pull_file
    is a string and may be left out, which means "Pull same file" (what the web app does); its only other
    value is "Pull next file based on name pattern", which also needs folder_path and name_pattern. A
    pull that finds no file at the path fails the create with the server''s reason; the recipe is recipes/file-import.md.
    To import from a REST API or Elasticsearch: the connection must exist first (connector connection
    create generic_rest_api, in the same project); try the query with connector ds-config create (data_sample,
    creates no dataset; connector connection query takes SQL only and refuses a REST config); then {"ds_creation_type":
    "cloud", "dataset_spec": {"connector_key": "generic_rest_api", "connection_key": KEY, "query_properties":
    {"ds_name": NAME, "table_name": TABLE, "query": "<JSON string of the endpoint config>"}, "schedule_properties":
    {"schedule_type": "moment", "first_pull_at": "now", "on_refresh_action": "replace"}, "recurrence_info":
    {"interval": 1, "start_at": "<future ISO time>"}}}. schedule_properties and recurrence_info are required
    (without them the job fails with Invalid parameters); on_refresh_action combine appends every refresh,
    so rows duplicate. The recipe is recipes/rest-api-import.md. To make a dataset from a database query
    (SQL Server, MySQL, Postgres, ...): connector connection create for the database, try the SELECT with
    connector connection query (read-only, saves nothing), then connector ds-config create CONNECTOR_KEY
    CONNECTION_KEY with {"query": SELECT, "table": NAME}; the recipe is recipes/database-import.md. Other
    ds_creation_type values and dataset_spec shapes: variants beyond the documented path are not qualified.'
- command_id: dataset.create-from-pdf
  output_schema: {ref: WriteResult}
  readback:
    command: dataset.list
    ids: {}
    kind: object
  known_restrictions: 'Add exactly one of table_list (table indices to extract) or is_preview_needed (true
    to preview the tables first) to the input: {"file_name": "report.pdf", "is_preview_needed": true}.
    The API refuses neither and refuses both. user_instruction cannot be combined with table_list.'
- command_id: dataset.data
  output_schema: openapi
- command_id: dataset.delete
  output_schema:
    ref: WriteResult
  readback:
    command: dataset.list
    ids: {}
    kind: object
- command_id: dataset.file-settings.get
  output_schema: openapi
- command_id: dataset.file-settings.undo
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: dataset.file-settings.update
    note: 'Run it with the settings you want back (--input); the undo did not keep the ones it replaced.'
  readback:
    command: dataset.file-settings.get
    ids:
      dataset_id: positional.0
    kind: object
- command_id: dataset.file-settings.update
  output_schema:
    ref: WriteResult
  undo:
    strategy: inverse
    command: dataset.file-settings.undo
  wait_policy: always_wait
  readback:
    command: dataset.file-settings.get
    ids:
      dataset_id: positional.0
    kind: object
- command_id: dataset.find
  output_schema:
    ref: DatasetFind
  command_path: dataset find
  disposition: command
  alias_of: null
  operation_ids: []
  positionals:
  - name: name_substring
    type: str
    required: false
    metavar: NAME_SUBSTRING
    falls_back_to_field: null
    help: Case-insensitive substring to match against dataset names; optional when --input gives 'columns'.
      Matches in other projects are listed too, marked in_project when --project is given.
  options: []
  sdk_symbol: mammoth_cli.commands.dataset.find
  sdk_conversion: Call mammoth_cli.commands.dataset.find with validated request fields.
  request_model: DatasetFindRequest
  result_model: DatasetFindResult
  mutation_class: read
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_read_only
  live_test: null
  live_exemption_reason: Local composite over already-covered project/dataset list reads.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth dataset find --help
  agent_example: mammoth dataset find sales
  unit_tests:
  - UT-DATASET-FIND
  contract_tests:
  - CT-DATASET-FIND-HUMAN
  - CT-DATASET-FIND-JSON
  - CT-DATASET-FIND-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: null
  reviewed_by: primary
- command_id: dataset.schema-diff
  output_schema:
    ref: DatasetSchemaDiff
  command_path: dataset schema-diff
  disposition: command
  alias_of: null
  operation_ids: []
  positionals:
  - name: destination_id
    type: int
    required: true
    metavar: DESTINATION_ID
    falls_back_to_field: null
    help: Dataset the rows would be appended into (the DATASET_ID of batch create).
  - name: source_id
    type: int
    required: true
    metavar: SOURCE_ID
    falls_back_to_field: null
    help: Dataset whose rows would be appended (the SOURCE_ID of batch create).
  options: []
  sdk_symbol: mammoth_cli.commands.dataset.schema_diff
  sdk_conversion: Call mammoth_cli.commands.dataset.schema_diff with validated request fields.
  request_model: DatasetSchemaDiffRequest
  result_model: DatasetSchemaDiffResult
  mutation_class: read
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_read_only
  live_test: null
  live_exemption_reason: Local composite over already-covered dataset get and dataset data reads.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth dataset schema-diff DESTINATION_ID SOURCE_ID --help
  agent_example: mammoth dataset schema-diff 10 11
  unit_tests:
  - UT-DATASET-SCHEMA-DIFF
  contract_tests:
  - CT-DATASET-SCHEMA-DIFF-HUMAN
  - CT-DATASET-SCHEMA-DIFF-JSON
  - CT-DATASET-SCHEMA-DIFF-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: null
  reviewed_by: primary
- command_id: dataset.get
  output_schema:
    ref: DatasetGet
- command_id: dataset.interpretation.confirm
  output_schema: {ref: WriteResult}
  readback:
    command: dataset.get
    ids:
      dataset_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Live coverage is tests/live/test_dataset_interpretation.py (runs on the test
    server against a preamble CSV).
  known_restrictions: 'Finalizes a dataset whose file has more than one plausible reading (status has_unstructured_data):
    applies the interpretation to the whole file and creates the table. Run interpretation preview first
    and pass the same input here, or the structure_map it returned. The suggestions stored on the dataset
    are under additional_info.interpretation.instruction_suggestions in dataset get. Pass mode "original"
    (alone: it takes no reshape field) to keep the file in the layout it was uploaded in; later files
    for the dataset are then ingested the same way, without review. The result state shows the dataset
    afterwards. Example: --input ''{"user_instruction": "Skip preamble rows, row 5 is the header"}''.'
- command_id: dataset.interpretation.preview
  output_schema: {ref: WriteResult}
  no_readback: preview only; nothing is applied to the dataset until interpretation confirm
  live_test: null
  live_exemption_reason: Live coverage is tests/live/test_dataset_interpretation.py (runs on the test
    server against a preamble CSV).
  known_restrictions: 'Shows the rows the dataset would have under an interpretation, without finalizing
    it: preview_rows (header plus up to 50 rows), total_row_count, structure_map and header_types. --input
    needs user_instruction (plain English; the suggestions stored on the dataset are in dataset get under
    additional_info.interpretation.instruction_suggestions), a structure_map from an earlier preview,
    or destination_dataset_id. Nothing is applied to the file until interpretation confirm. Example: --input
    ''{"user_instruction": "Skip preamble rows, row 5 is the header"}''.'
- command_id: dataset.list
  output_schema:
    ref: OpenResult
  known_restrictions: 'B01. Newest first. Each item carries rows and cols, created and updated time (updated
    is left out when it equals created), the source kind (file, connector, created in Mammoth, export
    of a view), and its column names with types, from the list route''s stored stats, sources and data_schema,
    cut to fit the agent tool output cap: more is true with next_offset when the page was cut. full true
    returns the raw id and name list. name (input field, a case-insensitive substring) reads every page
    and returns only the matching datasets as short rows (id, name, rows, cols; no column lists) with
    matched, and more with next_offset when cut; limit and offset then page over the matches. limit must
    be at most 100. names true returns up to 500 bare id and name rows of the project in ONE call, newest
    first, with total and more: use it for a list of names (which files can I see), never page offsets.
    Without a project use dataset find NAME_SUBSTRING.'
- command_id: dataset.refresh
  output_schema:
    ref: WriteResult
  operation_ids:
  - UpdateDataset
  confirmation: prompt_or_yes
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: dataset.get
    ids:
      dataset_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: No automated disposable-project fixture wired into tests/live yet for this command.
  agent_example: mammoth dataset refresh 123 --yes
  known_restrictions: Fetches the link of a dataset made from a URL (dataset create with ds_creation_type
    weburl; dataset list shows it as source url with the link host) again into the same dataset, and waits
    for the job. Whether the new data replaces or adds to the old follows the dataset's own data addition
    setting. A dataset not made from a URL is refused, and so is a URL that serves JSON; the server's
    reason is shown. A single CSV only. It never refreshes on a schedule, and automation run_data_retrieval
    cannot refresh it; for a scheduled pull from a URL use the REST API connector.
- command_id: dataset.rename
  output_schema:
    ref: WriteResult
  readback:
    command: dataset.get
    ids:
      dataset_id: positional.0
    kind: object
- command_id: dataset.restore
  output_schema:
    ref: WriteResult
  readback:
    command: dataset.get
    ids:
      dataset_id: positional.0
    kind: object
- command_id: dataset.column-stats
  output_schema:
    ref: DatasetColumnStats
  operation_ids: []
  sdk_symbol: mammoth_cli.commands.dataset.column_stats
  sdk_conversion: Call mammoth_cli.commands.dataset.column_stats with validated request fields.
  live_test: null
  live_exemption_reason: Read-only composite over the project's datasets column-stats route.
  known_restrictions: 'Needs a project. Use this instead of profiling each view when the question spans
    datasets ("missing values", "blanks", "data quality across the project"): one call returns every dataset''s
    columns with their blank count and share, type and distinct count, from stats stored at the last load
    or pipeline run. Rank columns by blank_pct (or blank_count) and name the worst dataset and column.'
- command_id: dataset.definition.list
  output_schema:
    ref: DatasetDefinitionList
  operation_ids: []
  pagination_policy: none
  live_test: null
  live_exemption_reason: Read-only route over the dataset's saved definitions.
  known_restrictions: Lists what terms mean for this dataset (id, term, definition), shared by everyone's
    chats on it. The project's definitions already appear in every turn's context, so there is no need
    to list them before answering; list them to find the id to remove.
- command_id: dataset.definition.add
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: dataset.definition.remove
  confirmation: confirm_target
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: No automated disposable-project fixture wired into tests/live yet for this command.
  agent_example: 'mammoth dataset definition add 123 --input ''{"term": "late", "definition": "delivered
    more than 5 days after shipped_date"}'' --yes --confirm 123'
  known_restrictions: 'Saves what a term means for this dataset: term (1-60 characters) and definition
    (1-300 characters) from --input. A definition is shared by everyone''s chats on this dataset, so the
    user confirms each save. Save one only when the user states what a term means for this data, not to
    answer a one-off question. Write the definition in terms of the dataset''s real column names. A definition
    for an existing term (any case) replaces it; at most 20 per dataset. The project''s definitions already
    appear in every turn''s context, so there is no need to list them before answering.'
  readback:
    command: dataset.definition.list
    ids:
      dataset_id: positional.0
    kind: object
- command_id: dataset.definition.remove
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: dataset.definition.add
    note: 'Run it with the term and definition that were removed (--input); the removal did not keep them.'
  mutation_class: benign_mutation
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: No automated disposable-project fixture wired into tests/live yet for this command.
  known_restrictions: Removes one definition by the id dataset definition list returns; use it when the
    user asks to drop or forget what a term means for this dataset. Everyone's chats on the dataset stop
    using it.
  readback:
    command: dataset.definition.list
    ids:
      dataset_id: positional.0
    kind: object
- command_id: dataset.search
  output_schema:
    ref: DatasetSearch
  operation_ids: []
  sdk_symbol: mammoth_cli.commands.dataset.search
  sdk_conversion: Call mammoth_cli.commands.dataset.search with validated request fields.
  live_test: null
  live_exemption_reason: Read-only composite over the project's datasets search route.
- command_id: dataset.trash
  output_schema:
    ref: WriteResult
  readback:
    command: dataset.get
    ids:
      dataset_id: positional.0
    kind: object
- command_id: dataset.update
  output_schema: {ref: WriteResult}
  no_readback: this command always rejects with a typed-command redirect before any write happens; there
    is no new state to read back
- command_id: dataset.tool-claim.get
  output_schema: openapi
- command_id: dataset.tool-claim.redeem
  output_schema:
    ref: WriteResult
  known_restrictions: The link must have been emailed to the signed-in user. Redeeming it again adds nothing
    and returns where the tables already are.
  no_readback: returns the workspace, project and new folder ids; the folder is the new state
