manifest_schema_version: 1
commands:
- command_id: workspace.accept-invite
  output_schema: {ref: WriteResult}
  secret_fields:
  - token
  agent_example: mammoth workspace accept-invite --input /private/path/request.json
  readback:
    command: workspace.list
    ids: {}
    kind: object
- command_id: workspace.app-usage
  output_schema: openapi
- command_id: workspace.check-expression
  output_schema:
    ref: WriteResult
  no_readback: generates a preview expression only; nothing is persisted to read back
- command_id: workspace.create
  output_schema:
    ref: WriteResult
  readback:
    command: workspace.get
    ids:
      workspace_id: result.id
    kind: object
- command_id: workspace.current
  output_schema:
    ref: OpenObject
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read-only; checked live on the koyal profile, not in the automated live suite.
  unit_tests:
  - test_the_manifest_gates_each_command_by_what_it_does
  contract_tests:
  - test_the_command_is_registered_and_reachable_from_the_cli
  known_restrictions: Read-only. The workspace this token acts in, and the server (resource) and project
    it is fenced to.
  unset:
  - options
- command_id: workspace.delete
  output_schema:
    ref: WriteResult
  readback:
    command: workspace.list
    ids: {}
    kind: object
- command_id: workspace.get
  output_schema: openapi
- command_id: workspace.list
  output_schema: openapi
- command_id: workspace.invite.delete
  output_schema:
    ref: WriteResult
  known_restrictions: Deletes pending invites for good and frees their seats. Take invite_ids from workspace
    invite list (a pending invite is not a workspace user; workspace user list never shows it).
  readback:
    command: workspace.invite.list
    ids: {}
    kind: object
- command_id: workspace.invite.list
  output_schema:
    ref: WorkspaceInviteList
  mutation_class: read
  acceptance_evidence: live_read_only
  live_test: LT-WORKSPACE-INVITE-LIST
  live_exemption_reason: null
  known_restrictions: Lists pending invites with id, email, status, role and invited_at. Optional project_id
    keeps invites that grant a role on that project.
  readback:
    command: workspace.invite.list
    ids: {}
    kind: object
- command_id: workspace.invite.resend
  output_schema:
    ref: WriteResult
  known_restrictions: Sends the invitation email again. Take invite_ids from workspace invite list.
  readback:
    command: workspace.invite.list
    ids: {}
    kind: object
- command_id: workspace.invite.revoke
  output_schema:
    ref: WriteResult
  known_restrictions: Marks pending invites revoked; the row stays. To remove an invite for good use workspace
    invite delete.
  readback:
    command: workspace.invite.list
    ids: {}
    kind: object
- command_id: workspace.invite.update-role
  output_schema:
    ref: WriteResult
  mutation_class: high_impact
  confirmation: yes_always
  agent_example: 'mammoth workspace invite update-role --input ''{"invite_id": 1, "role": "workspace_member"}''
    --yes'
  known_restrictions: Changes the workspace role a pending invite will grant (workspace_member, workspace_admin,
    workspace_owner, workspace_guest).
  readback:
    command: workspace.invite.list
    ids: {}
    kind: object
- command_id: workspace.llm-task
  output_schema:
    ref: WriteResult
  readback:
    command: job.get
    ids:
      job_id: result.job.id
    kind: delivery
- command_id: workspace.oauth-client.create
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: workspace.oauth-client.delete
  confirmation: yes_always
  live_exemption_reason: High-impact access change without a disposable fixture; checked by dry-run only.
  agent_example: 'mammoth workspace oauth-client create 123 --input ''{"name": "Revenue report", "redirect_uris":
    ["https://example.com/data.csv"]}'' --yes'
  unit_tests:
  - test_oauth_clients_create_sends_only_the_fields_given
  contract_tests:
  - test_the_command_is_registered_and_reachable_from_the_cli
  known_restrictions: Registers an OAuth client that can sign users in. A confidential client's client_secret
    is returned exactly once and shown once in this output; store it now, it cannot be fetched again.
    Send name and redirect_uris through --input.
  readback:
    command: workspace.oauth-client.list
    ids: {}
    kind: object
  unset:
  - options
- command_id: workspace.oauth-client.delete
  output_schema:
    ref: WriteResult
  live_exemption_reason: High-impact access change without a disposable fixture; checked by dry-run only.
  unit_tests:
  - test_oauth_clients_delete_names_the_client_in_the_workspace_path
  contract_tests:
  - test_the_command_is_registered_and_reachable_from_the_cli
  known_restrictions: Exact OAuth client ID confirmation (--yes --confirm ID). Deleting the client stops
    its grants working.
  readback:
    command: workspace.oauth-client.list
    ids: {}
    kind: object
  unset:
  - options
- command_id: workspace.oauth-client.list
  output_schema: openapi
  result_model: AuthOauthClientListResult
  edits_target: false
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read-only; checked live on the koyal profile, not in the automated live suite.
  unit_tests:
  - test_oauth_clients_list_uses_the_client_workspace_by_default
  contract_tests:
  - test_the_command_is_registered_and_reachable_from_the_cli
  known_restrictions: Read-only. The workspace's OAuth clients (id, client_id, name, redirect URIs). No
    client secret is returned.
  unset:
  - options
- command_id: workspace.oauth-client.revoke-grant
  output_schema:
    ref: WriteResult
  live_exemption_reason: High-impact access change without a disposable fixture; checked by dry-run only.
  unit_tests:
  - test_oauth_clients_revoke_grant_hits_the_grant_sub_path
  contract_tests:
  - test_the_command_is_registered_and_reachable_from_the_cli
  known_restrictions: Exact OAuth client ID confirmation (--yes --confirm ID). Every user who authorised
    this client must authorise it again.
  readback:
    command: workspace.oauth-client.list
    ids: {}
    kind: object
  unset:
  - options
- command_id: workspace.reactivate
  output_schema:
    ref: WriteResult
  known_restrictions: Turns a deactivated workspace back on; its users regain access and billing resumes.
    Needs --yes and --confirm WORKSPACE_ID (the refusal prints it).
  readback:
    command: workspace.get
    ids:
      workspace_id: positional.0
    kind: object
- command_id: workspace.segment.list
  output_schema: openapi
- command_id: workspace.segment.update
  output_schema:
    ref: WriteResult
  readback:
    command: workspace.segment.list
    ids: {}
    kind: object
- command_id: workspace.storage-breakdown
  output_schema: openapi
- command_id: workspace.update
  output_schema:
    ref: WriteResult
  known_restrictions: Patches workspace settings that apply to every member. Read them first (`workspace
    get`). Needs --yes and --confirm WORKSPACE_ID.
  readback:
    command: workspace.get
    ids:
      workspace_id: positional.0
    kind: object
- command_id: workspace.user.add
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: workspace.user.remove
  confirmation: yes_always
  readback:
    command: workspace.user.list
    ids: {}
    kind: object
- command_id: workspace.user.get
  output_schema:
    ref: OpenObject
- command_id: workspace.user.list
  output_schema:
    ref: OpenObjectList
  known_restrictions: Lists members only; a pending invite is not a member. For pending invites and their
    ids run workspace invite list. Optional project_id keeps one project's members.
- command_id: workspace.user.remove
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: workspace.user.add
    note: 'Run it with --input of the removed user''s email in email_ids; the removal did not keep it.'
  readback:
    command: workspace.user.list
    ids: {}
    kind: object
- command_id: workspace.user.remove-batch
  output_schema: {ref: WriteResult}
  known_restrictions: Removes members (ids) and/or pending invites (invite_ids). Take invite ids from
    workspace invite list; workspace invite delete is the dedicated command for invites.
  readback:
    command: workspace.user.list
    ids: {}
    kind: object
- command_id: workspace.user.update
  output_schema:
    ref: WriteResult
  readback:
    command: workspace.user.get
    ids:
      user_id: positional.0
    kind: object
- command_id: workspace.user.update-batch
  output_schema: {ref: WriteResult}
  known_restrictions: Changes the roles of several workspace users in one JSON-patch call; each gains
    or loses access at once. Read `workspace user list` first. Needs --yes and --confirm WORKSPACE_ID.
  readback:
    command: workspace.user.list
    ids: {}
    kind: object
- command_id: workspace.home
  output_schema:
    ref: WorkspaceHome
  operation_ids: []
  known_restrictions: 'The Home read: usage_summary (storage, plan), health_issues (type, severity, occurrence_count,
    available_actions) and suggestions. Read-only; not a chat turn.'
  readback:
    command: workspace.home
    ids: {}
    kind: object
- command_id: workspace.export-hosts.get
  output_schema: openapi
- command_id: workspace.export-hosts.set
  output_schema: openapi
  mutation_class: high_impact
  confirmation: yes_always
  readback:
    command: workspace.export-hosts.get
    ids: {}
    kind: object
  live_test: None
  live_exemption_reason: Sends or changes outbound mail or access for real people, so it is not run against
    a live server; contract and unit tests cover it.
  agent_example: 'mammoth workspace export-hosts set --input ''{"restricted": true}'' --yes'
  known_restrictions: Sets which hosts exports may send data to for the whole workspace. Admins only.
    Needs --yes.
