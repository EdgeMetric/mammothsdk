- command_id: support.triage
  output_schema: openapi
- command_id: support.usage-tiles
  output_schema: openapi
- command_id: support.workspace.activity
  output_schema: openapi
- command_id: support.workspace.archive
  output_schema:
    ref: WriteResult
  undo:
    strategy: inverse
    command: support.workspace.restore-archive
  readback:
    command: support.workspace.archive-info
    ids:
      workspace_id: positional.0
    kind: object
- command_id: support.workspace.archive-info
  output_schema: openapi
- command_id: support.workspace.chargebee-cancelled
  output_schema:
    ref: WriteResult
  readback:
    command: support.workspace.entitlement
    ids:
      workspace_id: positional.0
    kind: object
- command_id: support.workspace.deal-seed
  output_schema: openapi
- command_id: support.workspace.entitlement
  output_schema: openapi
- command_id: support.workspace.invite.cancel
  output_schema:
    ref: WriteResult
  no_readback: returns a message naming the invited address; the support API has no invite list to read
    back
- command_id: support.workspace.invite.resend
  output_schema:
    ref: WriteResult
  no_readback: emails the invitee again; the email is not readable through the API
- command_id: support.workspace.restore-archive
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: support.workspace.archive
    note: Archiving again needs a storage_class and the workspace's name as confirm_name, which the
      restore did not keep; run it with those two input fields.
  readback:
    command: support.workspace.archive-info
    ids:
      workspace_id: positional.0
    kind: object
- command_id: support.plan.update-entitlements
  output_schema:
    ref: WriteResult
  known_restrictions: Changes what every workspace on the plan is granted, at once. Legacy and system
    plans are read-only. Read `support plan get` first. Needs --yes and --confirm PLAN_ID (the refusal
    prints the exact target). --dry-run names the plan and the new values; the plan's current values are
    not readable from a mapped read, so compare with the plans matrix.
  readback:
    command: support.plan.get
    ids:
      plan_id: positional.0
    kind: object
- command_id: support.project-move.get
  output_schema: openapi
  known_restrictions: Tech admin only (Mammoth staff role); refused for every other user. Needs no workspace
    header. A move that is stalled (its worker died) resumes when `support workspace project move-start` runs again.
- command_id: support.project-move.purge
  output_schema:
    ref: WriteResult
  no_readback: queues the purge; `support project-move get MOVE_ID` shows its `purge` outcome
  known_restrictions: Tech admin only (Mammoth staff role); refused for every other user. Refused for a move
    that is not finished.
- command_id: support.workspace.project.list
  output_schema: openapi
  known_restrictions: Tech admin only (Mammoth staff role); refused for every other user.
- command_id: support.workspace.project.move-check
  output_schema: openapi
  known_restrictions: Tech admin only (Mammoth staff role); refused for every other user. Pass the workspace
    the project is in and the project id as positionals and target_workspace_id in --input.
- command_id: support.workspace.project.move-start
  output_schema:
    ref: WriteResult
  readback:
    command: support.project-move.get
    ids:
      move_id: result.move.id
    kind: object
  known_restrictions: Tech admin only (Mammoth staff role); refused for every other user. Run
    `support workspace project move-check` first; acknowledged_warnings must hold the code of every warning.
    A project with an unfinished move resumes that move.
