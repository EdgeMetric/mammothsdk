- command_id: support.plan.unarchive
  undo:
    strategy: inverse
    command: support.plan.archive
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Unarchives
    a plan archived with support plan archive.
  readback:
    command: support.plan.get
    ids:
      plan_id: positional.0
    kind: object
- command_id: support.plan.storage-option.list
  operation_ids: []
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Every purchasable
    storage size of the plan, archived ones included.
  readback:
    command: support.plan.storage-option.list
    ids: {}
    kind: object
- command_id: support.plan.storage-option.create
  undo:
    strategy: manual
    command: support.plan.storage-option.archive
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Adds a purchasable
    storage size to an inline-pricing plan. storage_gb is the TOTAL allocation, not an increment; prices
    are the monthly and annual add on top of the plan price.
  readback:
    command: support.plan.storage-option.list
    ids:
      plan_id: positional.0
    kind: object
- command_id: support.plan.storage-option.update
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Re-prices
    or resizes one storage option; send at least one of storage_gb, monthly_price, annual_price. Confirm
    with the option id.
  readback:
    command: support.plan.storage-option.list
    ids:
      plan_id: positional.0
    kind: object
- command_id: support.plan.storage-option.archive
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Retires
    the option so it can no longer be chosen; never deleted, subscriptions billed at that size keep it.
    Confirm with the option id.
  readback:
    command: support.plan.storage-option.list
    ids:
      plan_id: positional.0
    kind: object
- command_id: support.template.list
  operation_ids: []
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Every curated
    template, drafts and broken rows included, worst first, each with what is wrong and the action that
    fixes it.
  readback:
    command: support.template.list
    ids: {}
    kind: object
- command_id: support.template.edit
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: 'Platform admin only (Mammoth staff role); refused for every other user. Edits a
    curated template''s filing: changes holds title, description, use_case, function, industry (list)
    or sort_order; null clears a field. Optional base_version makes it conditional (409 when the row moved).
    notes says what changes for customers.'
  readback:
    command: support.template.list
    ids: {}
    kind: object
- command_id: support.template.data-preview
  operation_ids: []
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Up to 50
    rows of the data the template opens on; capped says whether there are more.
  readback:
    command: support.template.data-preview
    ids: {}
    kind: object
- command_id: support.template.canvas
  operation_ids: []
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. The template's
    canvas with its baked plan and specs, drafts included.
  readback:
    command: support.template.canvas
    ids: {}
    kind: object
- command_id: support.template.publish
  undo:
    strategy: inverse
    command: support.template.unpublish
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Takes a
    curated draft live in every customer's gallery. Refused, with nothing published, when the template
    fails on its own data.
  readback:
    command: support.template.list
    ids: {}
    kind: object
- command_id: support.template.unpublish
  undo:
    strategy: inverse
    command: support.template.publish
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Returns
    a live or retired curated template to draft; the board, canvas and row survive.
  readback:
    command: support.template.list
    ids: {}
    kind: object
- command_id: support.template.retire
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Keeps the
    row but stops the catalog offering or auditing it; reversible with support template unpublish.
  readback:
    command: support.template.list
    ids: {}
    kind: object
- command_id: support.template.inspect
  operation_ids: []
  mutation_class: read
  confirmation: none
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  agent_example: mammoth support template inspect template.zip
  known_restrictions: 'Platform admin only (Mammoth staff role); refused for every other user. Reads a
    template file without importing it: what it needs, whether it carries data and a picture, and whether
    the catalog already has it. Writes nothing. The file comes from the local disk.'
  readback:
    command: support.template.inspect
    ids: {}
    kind: object
  unset:
  - edits_target
- command_id: support.template.import
  confirmation: yes_always
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  agent_example: mammoth support template import template.zip --yes
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Imports
    a template file as a curated DRAFT (not published); an existing slug is updated in place. dataset
    names the data to bind a file that carries none. Inspect it first.
  readback:
    command: support.template.list
    ids: {}
    kind: object
- command_id: support.template.thumbnail.set
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: 'Platform admin only (Mammoth staff role); refused for every other user. Uploads
    or replaces a curated template''s picture: PNG, JPEG or WebP read from its content, 1 MB at most.'
  readback:
    command: support.template.list
    ids: {}
    kind: object
- command_id: support.template.thumbnail.clear
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Removes
    a curated template's picture; its card falls back to the og-card.
  readback:
    command: support.template.list
    ids: {}
    kind: object
- command_id: support.template.discard
  mutation_class: destructive
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: 'Platform admin only (Mammoth staff role); refused for every other user. Permanently
    removes a curated DRAFT, its preview board and its data (if no other template shares it). Refused
    for a live template: unpublish or retire it instead.'
  readback:
    command: support.template.list
    ids: {}
    kind: object
- command_id: support.template.snapshots
  operation_ids: []
  pagination_policy: single_page
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Every stored
    dataset the template catalog holds (curated and saved templates), and the templates holding none.
  readback:
    command: support.template.snapshots
    ids: {}
    kind: object
- command_id: support.template.audit
  operation_ids: []
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: 'Platform admin only (Mammoth staff role); refused for every other user. Re-runs
    every curated-catalog gate: faults with remedies, checked, and curated entries never seeded (missing).
    Read-only.'
  readback:
    command: support.template.audit
    ids: {}
    kind: object
- command_id: support.template.export
  operation_ids: []
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Downloads
    a curated template as a .zip template file (default <slug>.zip); with_data also packages a capped
    copy of its rows.
  readback:
    command: support.template.export
    ids: {}
    kind: object
- command_id: support.template.export-dashboard
  operation_ids: []
  acceptance_evidence: contract_only_no_disposable_fixture
  live_exemption_reason: Platform-admin operation on shared catalog or billing configuration; no disposable
    fixture.
  known_restrictions: Platform admin only (Mammoth staff role); refused for every other user. Downloads
    a dashboard you can edit as a .zip template file; slug (required) is the id an import matches on;
    with_data (default true) packages a capped copy of its rows.
  readback:
    command: support.template.export-dashboard
    ids: {}
    kind: object
