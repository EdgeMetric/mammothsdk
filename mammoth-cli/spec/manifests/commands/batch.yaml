manifest_schema_version: 1
commands:
- command_id: batch.bulk-delete
  output_schema:
    ref: WriteResult
  known_restrictions: ids is required (the backend rejects a delete with no batch ids; it never deletes
    all batches). List ids with batch list.
  readback:
    command: batch.list
    ids:
      dataset_id: positional.0
    kind: object
- command_id: batch.create
  output_schema: {ref: WriteResult}
  undo:
    strategy: manual
    command: batch.delete
  known_restrictions: Every source column must be mapped to an existing destination column; the CLI reads
    both schemas and refuses (append_mapping_incomplete) an unmapped source column or a destination the
    dataset lacks, because the backend appends only mapped columns. A destination column no mapping item
    fills (add_column items count) would be NULL in every appended row, so it is refused (append_leaves_columns_blank)
    unless the input lists exactly those names in blank_columns; the confirmed blanks are named in mapping_check.warnings.
    The CLI sends each item's expected_destination_c_type as the destination's current type (never re-types
    it; an explicit different value is refused with append_type_mismatch) and warns in mapping_check.warnings
    when source and destination types differ. SOURCE_ID is a standalone dataset in the same project (4BATC010
    INVALID_SOURCE_DATASET for a file id or an append child); to append a file use file upload with append_to_ds_id.
    delete_source_ds=true changes the mutation class to destructive and requires confirmation.
  readback:
    command: batch.list
    ids:
      dataset_id: positional.0
    kind: object
- command_id: batch.create-spec
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: batch.delete
  agent_example: 'mammoth batch create-spec 123 --input ''{"file_id": 94}'''
  readback:
    command: batch.list
    ids:
      dataset_id: positional.0
    kind: object
- command_id: batch.delete
  output_schema:
    ref: WriteResult
  readback:
    command: batch.list
    ids:
      dataset_id: positional.0
    kind: object
- command_id: batch.get
  output_schema: openapi
- command_id: batch.list
  output_schema: openapi
- command_id: batch.update
  output_schema: {ref: WriteResult}
  known_restrictions: 'The server takes one patch operation per call: {"patch": {"op": "replace", "path":
    "batches", "value": {"suspend": [BATCH_ID], "restore": [BATCH_ID]}}} (a list holding that one operation
    is also accepted; "path" defaults to batches). Any remove operation in the patch changes the mutation
    class to destructive.'
  readback:
    command: batch.list
    ids:
      dataset_id: positional.0
    kind: object
