manifest_schema_version: 1
commands:
- command_id: snippet.create
  output_schema:
    ref: WriteResult
  readback:
    command: snippet.get
    ids:
      snippet_id: result.id
    kind: object
- command_id: snippet.delete
  output_schema:
    ref: WriteResult
  readback:
    command: snippet.list
    ids: {}
    kind: object
- command_id: snippet.dependencies
  output_schema: openapi
- command_id: snippet.duplicate
  undo:
    strategy: manual
    command: snippet.delete
    note: 'Run it with the id of the copy (in its result), not the snippet that was copied.'
  output_schema:
    ref: WriteResult
  readback:
    command: snippet.get
    ids:
      snippet_id: result.id
    kind: object
- command_id: snippet.get
  output_schema: openapi
- command_id: snippet.list
  output_schema: openapi
- command_id: snippet.rerun
  output_schema:
    ref: WriteResult
  readback:
    command: snippet.get
    ids:
      snippet_id: positional.0
    kind: object
- command_id: snippet.update
  readback:
    command: snippet.get
    ids:
      snippet_id: positional.0
    kind: object
