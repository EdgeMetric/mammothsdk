  human_example: mammoth history undo ID --help
  agent_example: mammoth history undo 97b9ee41d15d --yes
  unit_tests:
  - UT-HISTORY-UNDO
  contract_tests:
  - CT-HISTORY-UNDO-JSON
  draft_test: null
  undo_test: null
  known_restrictions: Undoes pipeline edits (back to the version before), objects a write created (to
    the trash) and moves to the trash (restored). Permanent deletes and external effects (exports, sends)
    cannot be undone and are reported. Not available embedded.
  reviewed_by: primary
