manifest_schema_version: 1
commands:
- command_id: workflow.archive
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: 'Input: {archived: true|false, dataset_ids?: [int]}. The dataset ids are the workflow''s
    datasets now; it reads as active once it has others.'
- command_id: workflow.attach-dataset
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: Takes the dataset to attach as the second positional, DATASOURCE_ID. No input document.
- command_id: workflow.block.add
  output_schema:
    ref: WriteResult
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
- command_id: workflow.block.auth
  output_schema: {ref: WriteResult}
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
- command_id: workflow.block.config
  output_schema:
    ref: WriteResult
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
- command_id: workflow.block.type
  output_schema:
    ref: WriteResult
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
- command_id: workflow.canvas
  output_schema:
    ref: WriteResult
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
- command_id: workflow.cleanup
  output_schema:
    ref: WriteResult
  known_restrictions: Deletes the active project's ghost (orphaned, half-created) workflows for good;
    real workflows are untouched. Needs --project or an active project, and a prompt or --yes.
  readback:
    command: workflow.list
    ids: {}
    kind: object
- command_id: workflow.create
  output_schema:
    ref: WriteResult
  readback:
    command: workflow.get
    ids:
      workflow_id: result.id
    kind: object
- command_id: workflow.delete
  output_schema:
    ref: WriteResult
  readback:
    command: workflow.list
    ids: {}
    kind: object
- command_id: workflow.from-template
  output_schema:
    ref: WriteResult
  readback:
    command: workflow.get
    ids:
      workflow_id: result.id
    kind: object
- command_id: workflow.get
  output_schema: openapi
- command_id: workflow.graph
  output_schema: openapi
- command_id: workflow.list
  output_schema: openapi
- command_id: workflow.resolve-held
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: 'Takes the change''s key as the second positional, KEY. Input: {built: true|false
    (true: already in Mammoth, not built again; false: lift the hold so the next Save builds it), expected_version?:
    int}.'
- command_id: workflow.save
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: workflow.save-undo
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: 'Input (optional): {keys?: [change keys to save], expected_version?: int}. Omitted
    keys save every unsaved change; a stale expected_version fails with 409.'
- command_id: workflow.update
  output_schema: {ref: WriteResult}
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
- command_id: workflow.workspace-datasets
  output_schema: openapi
- command_id: workflow.workspace-exports
  output_schema: openapi
- command_id: workflow.workspace-sources
  output_schema: openapi
- command_id: workflow.save-undo
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: workflow.save
    note: 'Run it with the same WORKFLOW_ID and the settings you want (--input); the undo did not keep what it reverted.'
  mutation_class: destructive
  confirmation: prompt_or_yes
  wait_policy: always_wait
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
  agent_example: mammoth workflow save-undo 123 resource-123 --yes
  known_restrictions: Removes what the Save built (datasets, views, steps). Prompts, or pass --yes. Waits
    for the undo run.
- command_id: workflow.duplicate
  output_schema:
    ref: WriteResult
  wait_policy: always_wait
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: workflow.get
    ids:
      workflow_id: result.workflow_id
    kind: object
  live_test: None
  live_exemption_reason: No disposable fixture covers this write; contract and unit tests cover it.
  known_restrictions: Copies the chosen datasets, with their rows, views and steps, into a new workflow.
    Automations and outside exports are not copied.
- command_id: workflow.save-cancel-step
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: workflow.get
    ids:
      workflow_id: positional.0
    kind: object
  live_test: None
  live_exemption_reason: No disposable fixture covers this write; contract and unit tests cover it.
  known_restrictions: 'Cancels one step of a running Save; steps that need it are skipped. Best effort:
    a job already started may still finish.'
- command_id: workflow.template.list
  output_schema:
    type: object
    required: [templates]
    properties:
      templates:
        type: array
        items:
          type: object
  known_restrictions: Lists the project workflow-template catalog (ready-made reconciliations and reports),
    not the workspace templates of 'template list'. Pick a key, then run workflow template get KEY.
- command_id: workflow.template.get
  output_schema:
    type: object
- command_id: workflow.template.sample-result
  output_schema:
    type: object
- command_id: workflow.template.rank
  output_schema:
    type: object
    required: [tables]
    properties:
      tables:
        type: array
        items:
          type: object
  known_restrictions: 'Input: {input_key: INPUT_KEY, dataset_ids: [1 to 200 dataset ids]}. Judges each table
    from its column names and types alone, so it reads no rows.'
- command_id: workflow.template.fit
  output_schema:
    type: object
  known_restrictions: 'Input: {inputs: {INPUT_KEY: DATASET_ID}}. Read-only; the matches it proposes go
    into the preview and build inputs.'
- command_id: workflow.template.preview
  output_schema:
    type: object
  known_restrictions: 'Input: {inputs: {INPUT_KEY: DATASET_ID}, matches: {INPUT_KEY: {ROLE_KEY: {column:
    NAME}}}, settings?: {}}. Read-only: runs the template on the first rows of your tables.'
- command_id: workflow.template.samples
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: dataset.delete
    note: Delete each imported sample dataset (the result's inputs map names them); a second run finds
      the same tables again.
  readback:
    command: dataset.list
    ids: {}
    kind: object
  known_restrictions: Imports the template's sample tables into the project, once, so the template can be
    tried without your own data.
- command_id: workflow.template.build
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: workflow.delete
    note: Delete the workflow the build created, or undo its Save with workflow save-undo.
  readback:
    command: workflow.get
    ids:
      workflow_id: result.workflow.id
    kind: object
  known_restrictions: 'Input: {inputs, matches, destination_name, settings?, destination_emails?} as in
    workflow template preview; the server refuses a build whose own preview could not run. Answers while
    the Save runs: follow it with workflow get WORKFLOW_ID (canvas_state.save_run).'
