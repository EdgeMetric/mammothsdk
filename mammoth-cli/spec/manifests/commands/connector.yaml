  request_model: ConnectorConnectionQueryRequest
  result_model: ConnectorConnectionQueryResult
  mutation_class: read
  confirmation: none
  wait_policy: not_async
  pagination_policy: single_page
  acceptance_evidence: live_read_only
  live_test: LT-CONNECTOR-CONNECTION-QUERY
  live_exemption_reason: null
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth connector connection query CONNECTOR_KEY CONNECTION_KEY --help
  agent_example: 'mammoth connector connection query postgres prod-warehouse --input ''{"query": "SELECT region, SUM(revenue) FROM data GROUP BY region"}'''
  unit_tests:
  - UT-CONNECTOR-CONNECTION-QUERY
  contract_tests:
  - CT-CONNECTOR-CONNECTION-QUERY-HUMAN
  - CT-CONNECTOR-CONNECTION-QUERY-JSON
  - CT-CONNECTOR-CONNECTION-QUERY-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: Runs one SELECT on the connected database and returns a sample of its rows in
    data_sample (dataschema and rows). It saves no data source configuration and creates no dataset,
    so it needs no --yes; Mammoth keeps only the short-lived job that carried the request. The CLI
    refuses anything but a single SELECT or WITH ... SELECT, and the connection's database user decides
    what the database allows. The sample is limited to the first rows of the result, so add your own
    LIMIT or aggregate for a large table. To turn a query into a dataset use dataset create.
  reviewed_by: primary
