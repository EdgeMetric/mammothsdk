manifest_schema_version: 1
commands:
- command_id: connector.active
  output_schema: openapi
- command_id: connector.ai.chat
  output_schema:
    ref: WriteResult
  readback:
    command: connector.ai.session.list
    ids: {}
    kind: object
- command_id: connector.ai.history
  output_schema: openapi
- command_id: connector.ai.session.list
  output_schema:
    ref: ConnectorAiSessionList
- command_id: connector.ai.session.messages
  output_schema: openapi
- command_id: connector.ai.submit-column-selection
  output_schema:
    ref: WriteResult
  readback:
    command: connector.ai.session.list
    ids: {}
    kind: object
- command_id: connector.ai.submit-credentials
  output_schema:
    ref: WriteResult
  readback:
    command: connector.ai.session.list
    ids: {}
    kind: object
- command_id: connector.connection.create
  output_schema: {ref: WriteResult}
  undo:
    strategy: manual
    command: connector.connection.delete
  secret_fields:
  - config
  agent_example: mammoth connector connection create postgres --input /private/path/request.json --yes
  known_restrictions: The connection document depends on connector_key (see `connector get KEY` for its
    fields); credentials in it are secrets, so pass them through a protected --input FILE.
  readback:
    command: connector.connection.list
    ids:
      connector_key: positional.0
    kind: object
- command_id: connector.connection.delete
  output_schema:
    ref: WriteResult
  known_restrictions: Resolve immutable key before confirmation.
  readback:
    command: connector.connection.list
    ids:
      connector_key: positional.0
    kind: object
- command_id: connector.connection.get
  output_schema: openapi
  known_restrictions: Secrets in the returned config are redacted. Without --project it looks for the
    project that holds the connection; when none or several do, it fails with project_required and names
    them.
- command_id: connector.connection.list
  output_schema:
    ref: OpenObjectList
  known_restrictions: Without a connector key the result lists the connections of every connector in 'connector
    active', each row with its connector_key. Secrets in a connection's config are redacted.
- command_id: connector.connection.query
  output_schema:
    ref: OpenResult
  pagination_policy: single_page
  known_restrictions: Runs one SELECT on the connected database and returns a sample of its rows in data_sample
    (dataschema and rows). It saves no data source configuration and creates no dataset, so it needs no
    --yes; Mammoth keeps only the short-lived job that carried the request. The CLI refuses anything but
    a single SELECT or WITH ... SELECT, and the connection's database user decides what the database allows.
    The sample is limited to the first rows of the result, so add your own LIMIT or aggregate for a large
    table. To turn a query into a dataset use dataset create.
- command_id: connector.connection.update
  output_schema: {ref: WriteResult}
  secret_fields:
  - credentials
  agent_example: mammoth connector connection update postgres prod-warehouse --input /private/path/request.json
    --yes
  known_restrictions: Needs --yes if validation contacts the destination.
  readback:
    command: connector.connection.get
    ids:
      connector_key: positional.0
      connection_key: positional.1
    kind: object
- command_id: connector.ds-config.create
  output_schema: {ref: WriteResult}
  undo:
    strategy: manual
    command: connector.ds-config.delete
  known_restrictions: Needs exactly one source; validate and data_sample cannot be combined.
  readback:
    command: connector.ds-config.list
    ids:
      connector_key: positional.0
      connection_key: positional.1
    kind: object
- command_id: connector.ds-config.delete
  output_schema:
    ref: WriteResult
  known_restrictions: Resolve immutable key before confirmation.
  readback:
    command: connector.ds-config.list
    ids:
      connector_key: positional.0
      connection_key: positional.1
    kind: object
- command_id: connector.ds-config.delete-all
  output_schema:
    ref: WriteResult
  readback:
    command: connector.ds-config.list
    ids:
      connector_key: positional.0
      connection_key: positional.1
    kind: object
- command_id: connector.ds-config.get
  output_schema: openapi
  known_restrictions: Reads one data-source config by key (from `connector ds-config list`); secrets in
    it are redacted.
- command_id: connector.ds-config.list
  output_schema: openapi
  known_restrictions: Secrets in nested configuration are redacted.
- command_id: connector.ds-config.update
  output_schema:
    ref: WriteResult
  known_restrictions: Only the query path is supported by the server today; other paths are refused. Read
    the config first with `connector ds-config get`.
  readback:
    command: connector.ds-config.get
    ids:
      connector_key: positional.0
      connection_key: positional.1
      ds_config_key: positional.2
    kind: object
- command_id: connector.get
  output_schema: openapi
- command_id: connector.list
  output_schema:
    ref: OpenObjectList
- command_id: connector.query.generate
  output_schema:
    ref: OpenObject
  known_restrictions: Keys are nonempty and cannot contain '/'.
- command_id: connector.query.status
  output_schema: openapi
- command_id: connector.connection.list-all
  output_schema: openapi
- command_id: connector.connection.test
  output_schema:
    ref: WriteResult
  known_restrictions: Needs project admin; the check reaches the connection's own service and its result
    is kept.
  no_readback: returns the health check result itself (success, health_status, message); nothing else
    to read back
- command_id: connector.draft.browse
  output_schema: openapi
- command_id: connector.draft.create
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: connector.draft.discard
  readback:
    command: connector.draft.get
    ids:
      draft_id: result.id
    kind: object
- command_id: connector.draft.discard
  output_schema:
    ref: WriteResult
  readback:
    command: connector.draft.get
    ids:
      draft_id: positional.0
    kind: object
- command_id: connector.draft.fill
  output_schema:
    ref: WriteResult
  readback:
    command: connector.draft.get
    ids:
      draft_id: positional.0
    kind: object
- command_id: connector.draft.get
  output_schema: openapi
  known_restrictions: A per-parent table's `each` block says how its preview was sampled. `each.summary`
    reads like "sampled 20 of 76 parents; 17 read, 3 failed", or "capped at 20 parents, total unknown"
    when the parent table's row count is not known. `each.total` is the sample size, not the parent
    count (`each.parents_total` is).
- command_id: connector.draft.known-sources
  output_schema: openapi
- command_id: connector.draft.list
  output_schema: openapi
- command_id: connector.draft.open
  output_schema:
    ref: WriteResult
  readback:
    command: connector.draft.get
    ids:
      draft_id: positional.0
    kind: object
- command_id: connector.draft.read-tables
  output_schema:
    ref: WriteResult
  readback:
    command: connector.draft.get
    ids:
      draft_id: positional.0
    kind: object
- command_id: connector.draft.sample
  output_schema: {ref: WriteResult}
  readback:
    command: connector.draft.get
    ids:
      draft_id: positional.0
    kind: object
- command_id: connector.draft.save
  output_schema:
    ref: WriteResult
  readback:
    command: connector.draft.get
    ids:
      draft_id: positional.0
    kind: object
- command_id: connector.draft.source.join-candidates
  output_schema: openapi
- command_id: connector.draft.source.list
  output_schema: openapi
  known_restrictions: A per-parent table's `each.summary` says how many parents its preview sampled,
    out of how many when that is known (`each.parents_total`).
- command_id: connector.draft.source.preview
  output_schema:
    ref: WriteResult
  known_restrictions: Reads up to `limit` (1-100) rows through the connection and records what came
    back on the source. The limit is sent as given, but the server can return fewer rows; when the
    rows come back short of `limit` and the source holds more, the answer sets `capped` true with
    `limit_requested`, `limit_applied` and `source_row_count`. A preview is a sample; save the draft
    to read every row.
  no_readback: returns the source's first rows itself; nothing is saved for a read to show
- command_id: connector.draft.spec.get
  output_schema:
    type: object
    required: [spec, tables]
    properties:
      spec:
        type: object
      tables:
        type: array
        items:
          type: object
- command_id: connector.version.spec.get
  output_schema:
    type: object
    required: [spec, tables]
    properties:
      spec:
        type: object
      tables:
        type: array
        items:
          type: object
- command_id: connector.draft.update
  output_schema:
    ref: WriteResult
  readback:
    command: connector.draft.get
    ids:
      draft_id: positional.0
    kind: object
