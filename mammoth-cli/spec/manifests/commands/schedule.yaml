manifest_schema_version: 1
commands:
- command_id: schedule.create
  known_restrictions: 'BLOCKED[SCHEDULE_CREATE_NOT_IMPLEMENTED]: the backend answers 5GENR011 NOT_IMPLEMENTED;
    the command fails with feature_unavailable and makes no API call. Use `mammoth automation create`
    instead.'
  readback:
    command: schedule.get
    ids:
      schedule_id: result.id
    kind: object
- command_id: schedule.delete
  readback:
    command: schedule.list
    ids: {}
    kind: object
- command_id: schedule.get
- command_id: schedule.list
  known_restrictions: 'Retired: the command answers not_available and names the web app. No Mammoth server
    can list schedules for a project (GET answers HTTP 400 NOT_IMPLEMENTED), so do not poll it. Use `schedule
    get SCHEDULE_ID` with an id obtained elsewhere.'
- command_id: schedule.update
  readback:
    command: schedule.get
    ids:
      schedule_id: positional.0
    kind: object
