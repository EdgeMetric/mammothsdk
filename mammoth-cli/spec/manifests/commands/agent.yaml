commands:
- command_id: agent.action.delete
  command_path: agent action delete
  disposition: command
  alias_of: null
  operation_ids: []
  positionals:
  - name: action_id
    type: str
    required: true
    metavar: ACTION_ID
    falls_back_to_field: null
    help: ID of the recorded action (from agent action list).
  options: []
  sdk_symbol: mammoth.api.agents.AgentsAPI.action_delete
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.action_delete with the session id from --session and
    the positional id.
  request_model: AgentActionDeleteRequest
  result_model: AgentActionDeleteResult
  mutation_class: destructive
  edits_target: true
  confirmation: prompt_or_yes
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_disposable_project
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that made a change.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth agent action delete ACTION_ID --help
  agent_example: mammoth agent action delete resource-123
  unit_tests:
  - UT-AGENTACTIONDELETE
  contract_tests:
  - CT-AGENTACTIONDELETE
  draft_test: null
  undo_test: null
  known_restrictions: Writes. Deletes the object one recorded action made. The server deletes only an
    object the chat created (created=true in agent action list), refuses an object the chat only edited
    or that another object now uses, and re-checks your permission on it. The object goes to the trash,
    so it can be restored. Prompt or --yes. Needs --session SESSION_ID; an embedded chat supplies it.
  reviewed_by: primary
  readback:
    command: agent.action.list
    ids: {}
    kind: object
