- command_id: agent.chat
  command_path: agent chat
  disposition: command
  alias_of: null
  operation_ids:
  - AgentChat
  positionals: []
  options: []
  sdk_symbol: mammoth.api.agents.AgentsAPI.chat
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.chat with validated request fields.
  request_model: AgentChatRequest
  result_model: AgentChatResult
  mutation_class: benign_mutation
  edits_target: false
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_disposable_project
  live_test: LT-AGENT-CHAT
  live_exemption_reason: null
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth agent chat --help
  agent_example: 'mammoth agent chat --input ''{"message": "Summarize revenue by region", "scope": {"type":
    "workspace", "workspace_id": 123}, "client_context": {"project_id": 456}}'''
  unit_tests:
  - UT-AGENT-CHAT
  contract_tests:
  - CT-AGENT-CHAT-HUMAN
  - CT-AGENT-CHAT-JSON
  - CT-AGENT-CHAT-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: 'Scope is {"type": "workspace", "workspace_id": N}, {"type": "user", "user_id":
    N} or {"type": "account"}. Put the project the question is about in client_context as {"project_id":
    N}. The command starts the turn and waits for the reply, up to 120 seconds: pass "wait": 0 to
    return at once with the turn id, or a larger "wait" for a long turn. If the wait ends first the
    result has working: true; read the finished reply with agent session messages SESSION_ID. The
    CLI sends one idempotency key per message and repeats it on a gateway error, so a retry never
    starts a second turn.'
  reviewed_by: primary
  readback:
    command: agent.session.list
    ids: {}
    kind: object
