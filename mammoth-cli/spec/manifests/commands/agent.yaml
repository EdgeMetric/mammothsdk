manifest_schema_version: 1
commands:
- command_id: agent.action.delete
  output_schema: {ref: WriteResult}
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.action_delete with the session id from --session and
    the positional id.
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that made a change.
  unit_tests:
  - UT-AGENTACTIONDELETE
  contract_tests:
  - CT-AGENTACTIONDELETE
  known_restrictions: Writes. Deletes the object one recorded action made. The server deletes only an
    object the chat created (created=true in agent action list), refuses an object the chat only edited
    or that another object now uses, and re-checks your permission on it. The object goes to the trash,
    so it can be restored. Prompt or --yes. Needs --session SESSION_ID; an embedded chat supplies it.
  readback:
    command: agent.action.list
    ids: {}
    kind: object
- command_id: agent.action.list
  output_schema:
    ref: OpenObject
  operation_ids: []
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.action_list with the session id from --session and
    the positional id.
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that made a change.
  unit_tests:
  - UT-AGENTACTIONLIST
  contract_tests:
  - CT-AGENTACTIONLIST
  known_restrictions: 'Read-only. Lists every change the chat session made through the CLI (one row per
    write: action id, run and step, command, target object, whether the chat created the object, and its
    state after the write). Read it before agent action delete. Needs --session SESSION_ID; an embedded
    chat supplies it.'
- command_id: agent.chat
  output_schema: {ref: AgentTurnResult}
  known_restrictions: 'Scope is {"type": "workspace", "workspace_id": N}, {"type": "user", "user_id":
    N} or {"type": "account"}. Put the project the question is about in client_context as {"project_id":
    N}. The command starts the turn and waits for the reply, up to 120 seconds: pass "wait": 0 to return
    at once with the turn id, or a larger "wait" for a long turn. If the wait ends first the result has
    working: true; read the finished reply with agent session messages SESSION_ID. The CLI sends one idempotency
    key per message and repeats it on a gateway error, so a retry never starts a second turn.'
  readback:
    command: agent.session.list
    ids: {}
    kind: object
- command_id: agent.message.set-request-kind
  output_schema: {ref: WriteResult}
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.message_set_request_kind with the session id from
    --session, the positional message id and request_kind from --input.
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Write with contract coverage only; no disposable chat fixture on koyal.
  known_restrictions: Writes. Corrects the request kind a reply answered (ask, insight, build, automate
    or fix). Creator only. Needs --session SESSION_ID; an embedded chat supplies it.
  readback:
    command: agent.session.messages
    ids: {}
    kind: object
- command_id: agent.plan.edit-proposal
  output_schema: {ref: WriteResult}
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.plan_edit_proposal with the session id from --session
    and plan_id, action, key and the optional name from --input.
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Write with contract coverage only; no disposable plan fixture on koyal.
  known_restrictions: Writes. Renames or removes one item of the plan's waiting workflow proposal (action
    rename or remove, the item key, and name for a rename). Creator only. Needs --session SESSION_ID;
    an embedded chat supplies it.
  no_readback: returns the updated proposal
- command_id: agent.plan.approve
  output_schema: {ref: AgentTurnResult}
  operation_ids:
  - AgentChat
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.plan_approve with the session id; the plan reference
    is built from the session's current plan.
  confirmation: prompt_or_yes
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Write that needs a chat with a proposed plan; contract coverage only.
  agent_example: mammoth agent plan approve resource-123 --yes
  known_restrictions: 'Writes. This is the web app''s Run it: it approves every proposed step of the chat''s
    current plan and starts the work (paid model work). Typing ''Run it'' as a chat message does not approve.
    The plan_id is read from the session; the request key is made by the CLI. Prompt or --yes. Waits up
    to wait seconds (default 120; wait 0 returns at once) for the turn. A user control: an embedded chat
    is refused. agent session messages shows when a chat waits for approval.'
  no_readback: returns the started turn
- command_id: agent.plan.skip
  output_schema: {ref: AgentTurnResult}
  operation_ids:
  - AgentChat
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.plan_skip with the session id; the plan reference
    is built from the session's current plan.
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Write that needs a chat with a proposed plan; contract coverage only.
  known_restrictions: 'Writes. Marks the proposed plan step N skipped; it needs no model turn. Only a
    proposed step can be skipped. The plan_id is read from the session. A user control: an embedded chat
    is refused.'
  no_readback: returns the started turn
- command_id: agent.plan.discard
  output_schema: {ref: AgentTurnResult}
  operation_ids:
  - AgentChat
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.plan_discard with the session id; the plan reference
    is built from the session's current plan.
  confirmation: prompt_or_yes
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Write that needs a chat with a proposed plan; contract coverage only.
  agent_example: mammoth agent plan discard resource-123 --yes
  known_restrictions: 'Writes. Marks every proposed step of the chat''s current plan skipped; it needs
    no model turn. The plan_id is read from the session. A user control: an embedded chat is refused.'
  no_readback: returns the started turn
- command_id: agent.run.extend
  output_schema: {ref: AgentRunResult}
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_extend with the session id from --session and
    the positional id.
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that made a change.
  unit_tests:
  - UT-AGENTRUNEXTEND
  contract_tests:
  - CT-AGENTRUNEXTEND
  known_restrictions: 'Writes. Gives a capped run a fresh time budget (the 8 hour active-time cap). The
    server refuses extend when this command runs from inside the run itself: a run cannot extend itself,
    ask the user to extend it. Returns the run after the request. Needs --session SESSION_ID; an embedded
    chat supplies it.'
  readback:
    command: agent.run.status
    ids: {}
    kind: object
- command_id: agent.run.list
  output_schema:
    ref: OpenObject
  operation_ids: []
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_list with the session id from --session and the
    positional id.
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that made a change.
  unit_tests:
  - UT-AGENTRUNLIST
  contract_tests:
  - CT-AGENTRUNLIST
  known_restrictions: Read-only. Lists the runs of the chat session, newest first, with the same fields
    as agent run status. Needs --session SESSION_ID; an embedded chat supplies it.
- command_id: agent.run.pause
  output_schema: {ref: AgentRunResult}
  undo:
    strategy: inverse
    command: agent.run.resume
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_pause with the session id from --session and the
    positional id.
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that made a change.
  unit_tests:
  - UT-AGENTRUNPAUSE
  contract_tests:
  - CT-AGENTRUNPAUSE
  known_restrictions: Writes. Pauses the run after its current call finishes; a waiting run pauses at
    once. Returns the run after the request. Needs --session SESSION_ID; an embedded chat supplies it.
  readback:
    command: agent.run.status
    ids: {}
    kind: object
- command_id: agent.run.resume
  output_schema: {ref: AgentRunResult}
  undo:
    strategy: inverse
    command: agent.run.pause
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_resume with the session id from --session and
    the positional id.
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that made a change.
  unit_tests:
  - UT-AGENTRUNRESUME
  contract_tests:
  - CT-AGENTRUNRESUME
  known_restrictions: 'Writes. Resumes a paused run from where it stopped. The server refuses resume when
    this command runs from inside the run itself: a run cannot resume itself, ask the user to resume it.
    Returns the run after the request. Needs --session SESSION_ID; an embedded chat supplies it.'
  readback:
    command: agent.run.status
    ids: {}
    kind: object
- command_id: agent.run.status
  output_schema:
    ref: OpenObject
  operation_ids: []
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_status with the session id from --session and
    the positional id.
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that made a change.
  unit_tests:
  - UT-AGENTRUNSTATUS
  contract_tests:
  - CT-AGENTRUNSTATUS
  known_restrictions: 'Read-only. Shows the chat session''s current durable run: run id, state (running,
    waiting, paused, capped, done, failed or stopped), the step it is on, what it waits for, and the active
    time used and left of its 8 hour budget (time spent waiting on you does not count). Needs --session
    SESSION_ID; an embedded chat supplies it.'
- command_id: agent.run.stop
  output_schema: {ref: AgentRunResult}
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_stop with the session id from --session and the
    positional id.
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that made a change.
  unit_tests:
  - UT-AGENTRUNSTOP
  contract_tests:
  - CT-AGENTRUNSTOP
  known_restrictions: Writes. Stops the run and cancels its live step. A stopped run cannot be resumed.
    Returns the run after the request. Needs --session SESSION_ID; an embedded chat supplies it.
  readback:
    command: agent.run.status
    ids: {}
    kind: object
- command_id: agent.run.units.set
  output_schema:
    allOf:
    - {$ref: '#/$defs/WriteResult'}
    - type: object
      required: [registered, units_total]
      properties:
        registered: {type: integer}
        units_total: {type: integer}
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_units_set with the session id from --session,
    the positional run id and validated request fields.
  live_test: null
  live_exemption_reason: Live coverage runs on the test server with a chat session that has a run.
  unit_tests:
  - UT-AGENTRUNUNITSSET
  contract_tests:
  - CT-AGENTRUNUNITSSET
  known_restrictions: Writes. Reports once the objects a plan step will work on (kind is dataset, view
    and so on; 1 to 1000 units, each id with an optional name and project_id) so the run panel can list
    them and measure progress and the time left. A unit already listed is left as it is. Needs --session
    SESSION_ID; an embedded chat supplies it. The server, not the model, counts the units done and the
    time left.
  readback:
    command: agent.run.status
    ids: {}
    kind: object
- command_id: agent.run.instance.list
  output_schema: openapi
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_instances_list with the session id from --session
    and the positional run id.
  edits_target: false
  live_test: null
  live_exemption_reason: Live coverage runs on koyal with a chat session that has a run.
  contract_tests:
  - CT-AGENT-RUN-INSTANCE-LIST
  known_restrictions: 'Read-only. Lists the agents of the run: the main agent, its workers and recon helpers,
    with the ids the instance commands take. Needs --session SESSION_ID; an embedded chat supplies it.'
- command_id: agent.run.instance.messages
  output_schema: openapi
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_instance_messages with the session id from --session
    and the positional run and instance ids.
  edits_target: false
  live_test: null
  live_exemption_reason: Live coverage runs on koyal with a chat session that has a run.
  contract_tests:
  - CT-AGENT-RUN-INSTANCE-MESSAGES
  known_restrictions: Read-only. The messages one agent of the run sent or received. Needs --session SESSION_ID;
    an embedded chat supplies it.
- command_id: agent.run.instance.transcript
  output_schema: openapi
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_instance_transcript with the session id from --session
    and the positional run and instance ids.
  edits_target: false
  live_test: null
  live_exemption_reason: Live coverage runs on koyal with a chat session that has a run.
  contract_tests:
  - CT-AGENT-RUN-INSTANCE-TRANSCRIPT
  known_restrictions: Read-only. The model messages of one agent of the run, credentials redacted. Needs
    --session SESSION_ID; an embedded chat supplies it.
- command_id: agent.run.retry
  output_schema: {ref: AgentRunResult}
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_retry with the session id from --session and the
    positional run id.
  confirmation: prompt_or_yes
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Write that starts paid model work; contract coverage only, no live run on koyal.
  agent_example: mammoth agent run retry resource-123 --yes
  known_restrictions: Writes. Retries a failed or stopped run as a new run, which starts paid model work.
    Session owner only. Prompt or --yes. Needs --session SESSION_ID; an embedded chat is refused.
  readback:
    command: agent.run.status
    ids: {}
    kind: object
- command_id: agent.run.units.list
  output_schema: openapi
  sdk_conversion: Call mammoth.api.agents.AgentsAPI.run_units_list with the session id from --session,
    the positional run id and the optional step, state and cursor from --input.
  edits_target: false
  live_test: null
  live_exemption_reason: Live coverage runs on koyal with a chat session that has a run with units.
  contract_tests:
  - CT-AGENT-RUN-UNITS-LIST
  known_restrictions: Read-only. One page of the units the run's steps do, optionally only one step (step),
    one state (queued, running, done, failed or skipped) or from an offset (cursor). Needs --session SESSION_ID;
    an embedded chat supplies it.
- command_id: agent.session.delete
  output_schema:
    ref: WriteResult
  readback:
    command: agent.session.list
    ids: {}
    kind: object
- command_id: agent.session.list
  output_schema: openapi
- command_id: agent.session.messages
  output_schema: openapi
- command_id: agent.session.set-visibility
  output_schema:
    ref: WriteResult
  readback:
    command: agent.session.list
    ids: {}
    kind: object
- command_id: agent.turn.cancel
  output_schema:
    allOf:
    - {$ref: '#/$defs/WriteResult'}
    - type: object
      required: [session_id, turn_id, status]
      properties:
        session_id: {type: string}
        turn_id: {type: string}
        status: {type: string}
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: agent.session.messages
    ids: {}
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: 'Writes. Stops one turn of the chat session: no further model or tool call starts,
    the call running is cut, and the turn ends with a stopped event that lists the writes already made.
    Only the session''s owner may; a repeat, or a call after the turn ended, answers the turn''s state
    (stopping, stopped or ended). Needs --session SESSION_ID; an embedded chat supplies it.'
- command_id: agent.access.askers
  output_schema: openapi
  known_restrictions: Needs a manager of the workspace's AI Agent settings, or someone who manages the
    project's people. Returns a count.
- command_id: agent.access.chart.save
  output_schema:
    ref: WriteResult
  no_readback: returns the dashboard id the chart was saved to; that dashboard is the new state
- command_id: agent.access.grant.give
  output_schema:
    ref: WriteResult
  known_restrictions: Only a manager of the workspace's AI Agent settings can give access. People outside
    the workspace are invited as free guests. Needs --yes. Read `agent access grant list` afterwards.
  readback:
    command: agent.access.grant.list
    ids: {}
    kind: object
- command_id: agent.access.grant.list
  output_schema: openapi
  known_restrictions: Only a manager of the workspace's AI Agent settings can list grants.
- command_id: agent.access.grant.revoke
  output_schema:
    ref: WriteResult
  known_restrictions: Only a manager of the workspace's AI Agent settings can revoke. Removes the grant
    at once; the person loses the access. Prompts, or pass --yes.
  readback:
    command: agent.access.grant.list
    ids: {}
    kind: object
- command_id: agent.access.grant.update
  output_schema: {ref: WriteResult}
  known_restrictions: Only a manager of the workspace's AI Agent settings can change a grant.
  readback:
    command: agent.access.grant.list
    ids: {}
    kind: object
- command_id: agent.access.me
  output_schema: openapi
- command_id: agent.access.people
  output_schema: openapi
  known_restrictions: Only a manager of the workspace's AI Agent settings can list the people.
- command_id: agent.access.reach
  output_schema: openapi
  known_restrictions: Anyone reads their own; another person's (user_id) is for managers of the AI Agent
    settings only.
- command_id: agent.access.request.add-to-context
  output_schema:
    ref: WriteResult
  readback:
    command: agent.access.request.list
    ids: {}
    kind: object
- command_id: agent.access.request.create
  output_schema:
    ref: WriteResult
  readback:
    command: agent.access.request.list
    ids: {}
    kind: object
- command_id: agent.access.request.list
  output_schema: openapi
  known_restrictions: Only a manager of the workspace's AI Agent settings can list everyone's requests;
    `agent access request mine` lists your own.
- command_id: agent.access.request.mine
  output_schema: openapi
- command_id: agent.access.request.resolve
  output_schema:
    ref: WriteResult
  mutation_class: destructive
  confirmation: prompt_or_yes
  agent_example: 'mammoth agent access request resolve 123 --input ''{"status": "done"}'' --yes'
  known_restrictions: 'Irreversible: a resolved request cannot be reopened, and the requester is told.
    status is done, declined or dismissed (''open'' is refused). Prompts, or pass --yes.'
  readback:
    command: agent.access.request.list
    ids: {}
    kind: object
- command_id: agent.access.settings.get
  output_schema: openapi
  known_restrictions: Only a manager of the workspace's AI Agent settings can read them.
- command_id: agent.access.settings.update
  output_schema: {ref: WriteResult}
  mutation_class: high_impact
  confirmation: confirm_target
  acceptance_evidence: contract_only_high_impact
  live_test: null
  live_exemption_reason: High-impact or external-effect operation without a disposable fixture.
  agent_example: 'mammoth agent access settings update --input ''{"enabled": true}'' --yes --confirm 123'
  known_restrictions: Only a manager of the workspace's AI Agent settings can change them. Changes the
    AI agent for the whole workspace, not one project; only the fields given change. Needs --yes and --confirm
    WORKSPACE_ID (the refusal prints the exact target). --dry-run reads the current settings and shows
    each field going from its current to its new value.
  readback:
    command: agent.access.settings.get
    ids: {}
    kind: object
- command_id: agent.access.tree
  output_schema: openapi
  known_restrictions: Only a manager of the workspace's AI Agent settings can read the tree.
- command_id: agent.session.feedback.list
  output_schema: openapi
- command_id: agent.turn.rate
  output_schema:
    ref: WriteResult
  readback:
    command: agent.session.feedback.list
    ids:
      session_id: positional.0
    kind: object
