manifest_schema_version: 1
commands:
- command_id: automation.capabilities
  output_schema: openapi
  live_test: null
  live_exemption_reason: Live coverage is tests/live/test_automation_capabilities.py (runs on the test
    server).
  known_restrictions: 'Read-only. Lists everything an automation supports, straight from the server: tasks
    (each with task_type, summary, required_fields, optional_fields, options = accepted values per field,
    formats_in and formats_out = file formats it reads or writes) and conditions (the triggers: condition_type,
    summary, fields, options). Answer "can an automation do X?" (a PDF, an email attachment, a schedule)
    from this, never from memory. Then create with `automation create`.'
- command_id: automation.create
  output_schema:
    ref: WriteResult
  known_restrictions: 'B15 AUTOMATION_EXTERNAL_EFFECTS: run `automation capabilities` first: it lists
    every task, trigger, option and file format in and out (PDF included). Task models can pull cloud
    files and send email; requires connector/email allowlists and dedicated fixtures. Delete old rows
    on a schedule with task apply_retention_policy (datasource_id, rule_type time_based, count_based or
    condition_based). The CLI sets require_approval=true on a retention task that omits it (the route
    defaults to false, an unattended hard delete); require_approval=false with the delete action needs
    --yes --confirm unattended-delete. An emailed file is task send_an_alert with attachments.dataview_ids:
    each selected view is emailed as a CSV file. The combined row count of all attached views must stay
    within 100,000 -- over that, the automation is refused (and a run that grows past it fails).'
  readback:
    command: automation.get
    ids:
      automation_id: result.id
    kind: object
- command_id: automation.delete
  output_schema:
    ref: WriteResult
  readback:
    command: automation.get
    ids:
      automation_id: positional.0
    kind: object
- command_id: automation.get
  output_schema: openapi
  known_restrictions: Some servers answer this with HTTP 500 and an empty body for an automation that
    automation create just returned. The automation exists; this is a server error, so do not retry more
    than once.
- command_id: automation.list
  output_schema:
    ref: OpenObjectList
- command_id: automation.restore
  output_schema:
    ref: WriteResult
  readback:
    command: automation.get
    ids:
      automation_id: positional.0
    kind: object
- command_id: automation.trash
  output_schema:
    ref: WriteResult
  readback:
    command: automation.get
    ids:
      automation_id: positional.0
    kind: object
- command_id: automation.update
  output_schema:
    ref: WriteResult
  known_restrictions: 'Changes a live automation (run, status, retention approval): read it first (`automation
    get`). Needs --yes. Each patch item is op + path + value: `command` + `run` (run now), `replace` +
    `status` (`suspend` or `resume`), `replace` + `details` (an object with at least one of name, description,
    tasks, conditions). Paths are details, run, status, approve_retention, reject_retention.'
  readback:
    command: automation.get
    ids:
      automation_id: positional.0
    kind: object
- command_id: automation.folders
  output_schema: openapi
- command_id: automation.route.order
  output_schema:
    ref: WriteResult
  readback:
    command: automation.folders
    ids: {}
    kind: object
- command_id: automation.route.preview
  output_schema: openapi
- command_id: automation.run-file.add-anyway
  output_schema:
    ref: WriteResult
  no_readback: the held file is added to its destination dataset by the automation's next run; `automation
    runs AUTOMATION_ID` shows that run
- command_id: automation.runs
  output_schema: openapi
