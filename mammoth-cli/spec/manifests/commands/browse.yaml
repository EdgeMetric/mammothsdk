manifest_schema_version: 1
commands:
- command_id: browse.folder
  output_schema:
    ref: BrowseFolder
- command_id: browse.project
  output_schema: openapi
  known_restrictions: Some servers answer this with HTTP 500; that is a server error, not server_unavailable.
- command_id: browse.root
  output_schema: openapi
- command_id: browse.workspace
  output_schema: openapi
- command_id: browse.resources
  output_schema:
    ref: BrowseResources
  operation_ids: []
  pagination_policy: cursor
  known_restrictions: 'One project''s resources a cursor page at a time (resources v2): pass next_cursor
    back as cursor while has_more is true. Optional parent_type and parent_id list inside a folder; resource_type,
    search, sort and fields narrow the page.'
  readback:
    command: browse.resources
    ids: {}
    kind: object
- command_id: browse.resource
  output_schema:
    ref: BrowseResource
  operation_ids: []
  known_restrictions: One resource of the project with its full properties (resources v2); name the type,
    then the id.
  readback:
    command: browse.resource
    ids: {}
    kind: object
- command_id: browse.ancestors
  output_schema:
    ref: BrowseAncestors
  operation_ids: []
  known_restrictions: 'The folder path (breadcrumb) of a FOLDER of the active project: the chain from
    the project root down to the folder itself, root first (resources v2). Pass the folder''s resource_id
    from browse resources, not its object id. Any other id answers 404; 0 means the project root and returns
    an empty path. For a dataset or view, take its parent_resource_id first.'
  readback:
    command: browse.ancestors
    ids: {}
    kind: object
- command_id: browse.search
  output_schema:
    ref: BrowseResources
  operation_ids: []
  pagination_policy: cursor
  known_restrictions: 'Searches resources across every project you can open in the workspace (resources
    v2), a cursor page at a time: pass next_cursor back as cursor while has_more is true. search matches
    names; resource_type (comma-separated), sort and fields narrow the page. Needs no active project.
    Each dataset hit carries dataset_id (its object_id) and each view hit view_id: pass those, never the
    tree id.'
  readback:
    command: browse.search
    ids: {}
    kind: object
- command_id: browse.resources.bulk
  output_schema:
    ref: BrowseResourcesBulk
  operation_ids: []
  mutation_class: read
  acceptance_evidence: live_read_only
  known_restrictions: Gets many resources of the active project by type and id in one request (resources
    v2; 100 pairs per request, more are chunked). Pass items in --input as [type, id] pairs, for example
    [["dataview", 42]]. A pair that does not exist in the project, or that you cannot read, is left out
    of the answer.
  readback:
    command: browse.resources.bulk
    ids: {}
    kind: object
  unset:
  - edits_target
