manifest_schema_version: 1
commands:
- command_id: file.bulk-delete
  output_schema: {ref: WriteResultOrNull}
  readback:
    command: file.list
    ids: {}
    kind: object
  known_restrictions: Deletes every listed uploaded file for good and cannot be undone. List them first
    (`file list`). Needs a prompt or --yes.
- command_id: file.delete
  output_schema: {ref: WriteResultOrNull}
  readback:
    command: file.list
    ids: {}
    kind: object
- command_id: file.extract-sheets
  output_schema: openapi
  readback:
    command: file.get
    ids:
      file_id: positional.0
    kind: object
- command_id: file.get
  output_schema:
    ref: FileGet
- command_id: file.list
  output_schema:
    ref: FileList
- command_id: file.multi-sheet-extract
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  no_readback: the file is gone after a default extract; read the new datasets with dataset list
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: 'Input: {tables: [{sheet_name, dataset_name, structure_map, block_id?, combine_group_id?,
    source_label?, sheet_block_count?}] (1 to 100 accepted reads from file multi-sheet-preview), delete_file_after_extract?}.
    The file is deleted after extraction unless delete_file_after_extract is false.'
- command_id: file.multi-sheet-preview
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  no_readback: preview only; nothing is created until file multi-sheet-extract
  live_test: null
  live_exemption_reason: 'Preview only: creates nothing; a live run needs a multi-sheet file id on the
    box.'
  known_restrictions: 'Input: {sheet_name (required), block_id?, user_instruction?, structure_map?}. Shows
    how one sheet reads before any dataset exists; nothing is saved.'
- command_id: file.set-password
  output_schema:
    type: object
    properties:
      failure_reason:
        type: [string, 'null']
      job_id:
        type: [integer, 'null']
      status_code:
        type: [integer, 'null']
  readback:
    command: file.get
    ids:
      file_id: positional.0
    kind: object
  secret_fields:
  - password
  agent_example: mammoth file set-password 123 --input /private/path/request.json --yes --confirm 123
- command_id: file.update
  output_schema: openapi
  readback:
    command: file.get
    ids:
      file_id: positional.0
    kind: object
  known_restrictions: Existing method waits but returns the pre-wait response; must return stable final
    state. Path extract_pdf_tables takes a typed value (filename, extraction_method tables_only, all_content
    or custom, optional user_instruction with instruction and instruction_type, preview_page, extract_full_document,
    delete_file_after_extract) - the extraction setting a dataset's saved recipe replays for PDFs an automation
    receives.
- command_id: file.upload
  output_schema: {ref: UploadResult}
  no_readback: the upload result already carries each ready dataset's post-processing view (columns, row_count,
    sample rows) from a real read
  known_restrictions: 'Accepted extensions: csv tsv psv txt xls xlsx xml pdf tiff jpeg jpg png heic webp
    and archives zip gz bz2 tar 7z (not json). Request size is capped by the ingress in front of the API:
    a 60 MB upload is refused with HTTP 413 (invalid_argument) before the API sees it; 16 MB is accepted
    (measured on release 2026-09-19; the cap between them is not pinned down). Keep one upload well under
    16 MB: split larger files or upload a zip/gz. Parsing is asynchronous; use --timeout 300 for files
    past a few MB and poll the returned job on timeout. Upload authorization is tenant- and scope-specific;
    a permission failure does not make this route universally unavailable. On success retain returned
    IDs, read them back, and verify owned cleanup; do not assume other upload variants are qualified.
    Each sheet of an Excel file becomes its own dataset. The input field mode (replace or add) sets the
    update method of the dataset the file is appended to: it needs append_to_ds_id and cannot be combined
    with wait_for_completion false (both are usage errors). An upload into a dataset whose columns do
    not match is not appended: the command fails with code schema_mismatch, rows_added 0 and
    kept_dataset_ids (the file''s own dataset stays in the project as a separate dataset; delete it
    or fix the file and upload again). The input field override_target_schema (make the file''s columns
    the dataset''s) is honoured by the server only when the dataset''s update method is replace, which
    deletes the rows it holds: the CLI refuses it under any other method before sending the file, and
    without append_to_ds_id or with wait_for_completion false.'
- command_id: file.upload-folder
  output_schema: {ref: FolderUploadResult}
  readback:
    command: file.list
    ids: {}
    kind: object
