manifest_schema_version: 1
commands:
- command_id: completion.install
  output_schema:
    allOf:
    - {$ref: '#/$defs/WriteResult'}
    - type: object
      required: [shell, path, added, detail]
      properties:
        shell: {type: string}
        path: {type: string}
        added: {type: boolean}
        detail: {type: string}
  readback:
    command: completion.show
    ids:
      shell: positional.0
    kind: object
- command_id: completion.show
  output_schema:
    ref: CompletionShow
