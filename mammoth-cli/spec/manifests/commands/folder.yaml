manifest_schema_version: 1
commands:
- command_id: folder.bulk-delete
  known_restrictions: Deletes every listed folder for good and cannot be undone. List them first (`folder
    list`). Needs a prompt or --yes.
  readback:
    command: folder.list
    ids: {}
    kind: object
- command_id: folder.create
  readback:
    command: folder.get
    ids:
      folder_id: result.id
    kind: object
- command_id: folder.delete
  readback:
    command: folder.list
    ids: {}
    kind: object
- command_id: folder.find
  command_path: folder find
  disposition: command
  alias_of: null
  operation_ids: []
  positionals:
  - name: name_substring
    type: str
    required: true
    metavar: NAME_SUBSTRING
    falls_back_to_field: null
    help: Case-insensitive substring to match against folder names.
  options: []
  sdk_symbol: mammoth_cli.commands.folder.find
  sdk_conversion: Call mammoth_cli.commands.folder.find with validated request fields.
  request_model: FolderFindRequest
  result_model: FolderFindResult
  mutation_class: read
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_read_only
  live_test: null
  live_exemption_reason: Local composite over already-covered project/folder list reads.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth folder find NAME_SUBSTRING --help
  agent_example: mammoth folder find reports
  unit_tests:
  - UT-FOLDER-FIND
  contract_tests:
  - CT-FOLDER-FIND-HUMAN
  - CT-FOLDER-FIND-JSON
  - CT-FOLDER-FIND-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: null
  reviewed_by: primary
- command_id: folder.get
- command_id: folder.list
- command_id: folder.move
  known_restrictions: Prefer dataset_ids/view_ids (the plain ids dataset get/view get return) over resource_ids
    -- the SDK resolves them to resource ids for you. resource_ids itself takes each item's resource id,
    not a dataset/view's own id. target_folder_resource_id is the destination folder's id, exactly as
    folder list/folder get/folder create return it (the id the web app opens the folder by).
  readback:
    command: job.get
    ids:
      job_id: result.job_id
    kind: delivery
- command_id: folder.root
- command_id: folder.trash
  readback:
    command: folder.get
    ids:
      folder_id: positional.0
    kind: object
- command_id: folder.update
  readback:
    command: folder.get
    ids:
      folder_id: positional.0
    kind: object
