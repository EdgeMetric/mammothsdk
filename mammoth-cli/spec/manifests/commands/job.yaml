manifest_schema_version: 1
commands:
- command_id: job.get
  output_schema: openapi
- command_id: job.get-many
  output_schema: openapi
- command_id: job.wait
  output_schema:
    ref: JobWait
  known_restrictions: 'On success, outcome is the state of what the job acted on: a view run gives the
    view (rows, cols, columns, status, pipeline_running) from one read, a project copy gives datasets,
    views, skipped and runs (ok, failed with each error, pending) from the job itself. No view get or
    view analyze is needed after it. A view that cannot be read is outcome_error, not a failed wait.'
- command_id: job.wait-many
  output_schema: openapi
