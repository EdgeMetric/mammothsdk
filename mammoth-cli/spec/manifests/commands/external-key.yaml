manifest_schema_version: 1
commands:
- command_id: external-key.create
  secret_fields:
  - secure_key
  agent_example: mammoth external-key create --input /private/path/request.json --yes
  known_restrictions: 'secure_key is a secret_fields entry: --input FILE, mode 0600 (shell) or the --input
    JSON''s secure_key field (embedded), behind the confirmation card; never in a reply, note, checkpoint
    or run log. Response is recursively redacted.'
  readback:
    command: external-key.get
    ids:
      key_id: result.id
    kind: object
- command_id: external-key.delete
  readback:
    command: external-key.list
    ids: {}
    kind: object
- command_id: external-key.get
- command_id: external-key.list
  output_schema: openapi
