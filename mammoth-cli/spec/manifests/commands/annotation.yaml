manifest_schema_version: 1
commands:
- command_id: annotation.comment.add
  no_readback: AddComment's response (id/annotation_id/body/created_by/created_at) has no target_type/target_id;
    the only read command (annotation.list) filters by target, not by annotation_id, so the specific comment
    thread cannot be read back.
- command_id: annotation.create
  readback:
    command: annotation.list
    ids:
      target_type: input.target_type
      target_id: input.target_id
    kind: object
- command_id: annotation.delete
  readback:
    command: annotation.list
    ids: {}
    kind: object
- command_id: annotation.list
  output_schema: openapi
- command_id: annotation.update
  readback:
    command: annotation.list
    ids:
      target_type: result.target_type
      target_id: result.target_id
    kind: object
