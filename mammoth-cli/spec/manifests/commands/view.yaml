  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_read_only
  live_test: null
  live_exemption_reason: Live coverage is tests/live/test_view_profile.py (runs on the test server); the
    arithmetic is unit-tested in tests/unit/services/test_data_profile.py.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth view data profile VIEW_ID --help
  agent_example: 'mammoth view data profile 123 --input ''{"target": "Churn"}'''
  unit_tests:
  - UT-VIEW-DATA-PROFILE
  contract_tests:
  - CT-VIEW-DATA-PROFILE
  draft_test: null
  undo_test: null
  known_restrictions: 'Read-only profile of the WHOLE view (every row, not a page of 50): per column the
    blank count, distinct count, min and max (NUMERIC and DATE) and top values; a "summary" of constant,
    all-blank and mostly-blank columns; "spelling_variants" per TEXT column -- spellings of one value
    that differ by case, punctuation or legal form (Ltd = Limited, Inc = Incorporated ...) -- with a ready
    "bulk_replace" input and the full "command" to merge them. Use it to explore, understand or profile
    a dataset, find blanks, duplicates and dirty categories. Blanks, distinct counts and min/max come
    from the stats the backend stored for the view when their row count equals the view row count now;
    otherwise (stale after a pipeline step, or none stored) they are queried in a few multi-column
    pivots. The "sources" block says which, and that the backend records no as-of time; each column
    "from" says stored or query. Top values, spelling variants and the target comparison are always
    queried. --input: "target" (a column with 2-20 values, e.g. churn) adds the target distribution
    (positive_rate of its rarest class) and "association": "categorical" columns ranked by cramers_v
    (one grouped count per column) and "numeric" columns ranked by standardized_difference (two
    multi-column pivots) -- the churn drivers; "columns" (names) profiles only those; "top" values per
    column (default 5); "limit" columns shown in detail (default 50; the summary always covers all).
    A column with more than 5000 distinct values gets counts and min/max but no value list. Example:
    --input ''{"target": "CHURN", "limit": 20}''.'
  reviewed_by: primary
