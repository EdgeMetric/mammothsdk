- command_id: view.column.format.set
  output_schema:
    allOf:
    - {$ref: '#/$defs/WriteResult'}
    - type: object
      required: [formatted, row_check]
      properties:
        formatted: {type: object}
        row_check: {type: object}
  operation_ids:
  - Patch
  readback:
    command: view.data.get
    ids:
      view_id: positional.0
    kind: data
  known_restrictions: 'A view display setting (the web grid''s column format menu), not a pipeline task:
    it changes how values show, not the stored values, and adds no task. Date columns take date_format
    (python style, %d-%b-%Y) or postgres_date_format (DD-Mon-YYYY); numeric columns take decimal_spec
    (decimal places), currency_symbol, is_percentage, thousands_separator, decimal_separator. Keys given
    replace the same keys of the column''s format; the rest are kept. To change how TEXT is read as a
    date, use view transform convert-type.'
- command_id: view.conditional-format.create
  output_schema:
    allOf:
    - {$ref: '#/$defs/WriteResult'}
    - type: object
      required: [created_rule_ids, rules_created]
      properties:
        created_rule_ids: {type: array}
        rules_created: {type: integer}
        note: {type: string}
  readback:
    command: view.conditional-format.list
    ids:
      view_id: positional.0
    kind: object
  known_restrictions: 'columns + operator + value + color colour each cell by its own value: one RULE
    per column, created in this one call (applies_to columns, the default). applies_to row makes one rule
    over any/all (match) of the columns. A raw rule body ({"cf_type": "RULE"|"COLOR_SCALE", "payload":
    {...}}) still works instead; applies_to must be row or columns.'
- command_id: view.conditional-format.delete-all
  output_schema:
    ref: WriteResult
  readback:
    command: view.conditional-format.list
    ids:
      view_id: positional.0
    kind: object
- command_id: view.conditional-format.list
  output_schema: openapi
- command_id: view.conditional-format.replace
  output_schema:
    allOf:
    - {$ref: '#/$defs/WriteResult'}
    - type: object
      required: [created_rule_ids, deleted_rule_ids]
      properties:
        created_rule_ids: {type: array}
        deleted_rule_ids: {type: array}
  operation_ids:
  - CreateConditionalFormat
  - DeleteConditionalFormat
  readback:
    command: view.conditional-format.list
    ids:
      view_id: positional.0
    kind: object
  known_restrictions: Same input as view conditional-format create (typed fields or a raw rule). Deletes
    every existing rule of the view, then creates the new ones, in one call; a refused rule leaves the
    rules created so far and the error names deleted_rule_ids and created_rule_ids. To add a rule beside
    the others use create.
- command_id: view.conditional-format.update
  output_schema:
    ref: WriteResult
  readback:
    command: view.conditional-format.list
    ids:
      view_id: positional.0
    kind: object
- command_id: view.create
  output_schema:
    ref: WriteResult
  readback:
    command: view.data.get
    ids:
      view_id: result.id
    kind: data
  known_restrictions: 'To work on a dataset''s changes without touching its own views, create a working
    view; clone_from (a view id of the same dataset) carries that view''s steps. A dataset''s own view
    is the default_view of view list, never the newest or an agent-made view: read it, or clone it with
    clone_from when steps are needed; edit it in place only when asked to change that view.'
- command_id: view.variants.create
  output_schema:
    allOf:
    - {$ref: '#/$defs/WriteResult'}
    - type: object
      required: [column, dataset_id, from_view, variants, view_ids]
      properties:
        column: {type: string}
        dataset_id: {type: integer}
        from_view: {type: integer}
        variants: {type: array}
        view_ids:
          type: array
          items: {type: integer}
  command_path: view variants create
  disposition: command
  alias_of: null
  operation_ids:
  - AddDataview
  - AddTask
  positionals:
  - name: dataset_id
    type: int
    required: true
    metavar: DATASET_ID
    falls_back_to_field: null
    help: ID of the dataset.
  options: []
  sdk_symbol: mammoth.client.ViewsResource.create
  sdk_conversion: 'CLI composite: per value, ViewsResource.create (clone_from the source view) then View.filter_rows
    (column = value), from mammoth_cli.commands.view_ops; the accepted document fields are in command_contract.py.'
  request_model: ViewVariantsCreateRequest
  result_model: ViewVariantsCreateResult
  mutation_class: benign_mutation
  edits_target: false
  undo:
    strategy: "trash_created"
  confirmation: none
  wait_policy: always_wait
  pagination_policy: none
  acceptance_evidence: live_disposable_project
  readback:
    command: view.get
    ids:
      view_id: result.view_ids.0
    kind: object
  live_test: null
  live_exemption_reason: Live coverage is tests/live/test_view_variants.py (runs on the test server);
    the plan and the partial-failure report are unit-tested in tests/unit/services/test_view_variants.py.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth view variants create DATASET_ID --help
  agent_example: 'mammoth view variants create 123 --input ''{"from_view": 456, "column": "Region", "values":
    ["East", "West"]}'''
  unit_tests:
  - UT-VIEW-VARIANTS-CREATE
  contract_tests:
  - CT-VIEW-VARIANTS-CREATE-HUMAN
  - CT-VIEW-VARIANTS-CREATE-JSON
  - CT-VIEW-VARIANTS-CREATE-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: 'Use when the user wants the same view once per value ("per region", "one view for
    each segment") and separate views are needed; for one view the viewer filters, use dashboard filter
    add. --input: "from_view" (a view of DATASET_ID whose steps every variant copies, required), "column"
    (a column of that view, required), "values" (1 to 50 distinct values, required), optional "name_template"
    (default "{view} - {value}"; must make distinct names, so keep {value}). Each variant is a new view
    cloned from from_view, then filtered to column = value. Refuses an unknown column before creating
    anything. Stops at the first failure with variants_partial_failure, whose details list the views already
    created, the failed value, the values not attempted and the unfiltered view left by the failed value
    (delete it, then rerun the rest). Returns view_ids and per-value variants.'
  reviewed_by: primary
- command_id: view.data-check.create
  output_schema:
    ref: WriteResult
  readback:
    command: view.data-check.list
    ids:
      view_id: positional.0
    kind: object
  known_restrictions: 'body needs a placement: pinned_to_end true or a task_sequence (4GENR007 "Either
    task_sequence or pinned_to_end must be set" otherwise). An alert the user asks for ("tell me when
    late deliveries go above 10") is a data check: pinned_to_end true, fail_behavior "flag_and_continue"
    (the default "halt" stops the pipeline), and one row_count check with condition "lte" and value 10
    whose config condition_sql filters the rows to count, e.g. "\"Status\" = ''Late''" (column display
    names). It is re-tested after every pipeline run and source refresh, and its owner gets an in-app
    notice when it starts failing (once, not on every failing run). Say it fires when the count goes above
    the value, not below.'
- command_id: view.data-check.delete
  output_schema:
    ref: WriteResult
  readback:
    command: view.data-check.list
    ids:
      view_id: positional.0
    kind: object
- command_id: view.data-check.get
  output_schema: openapi
- command_id: view.data-check.list
  output_schema: openapi
- command_id: view.data-check.update
  output_schema:
    ref: WriteResult
  readback:
    command: view.data-check.get
    ids:
      view_id: positional.0
      data_check_id: positional.1
    kind: object
  known_restrictions: 'patches are {op: command, path: enable|disable, value: null} or {op: replace, path:
    spec, value: AddDataCheckSpec}, the same body the web app sends. On release the PATCH returns HTTP
    500 (outcome_unknown) from backend validation that runs after the change is committed; read the check
    back with view data-check get before retrying.'
- command_id: view.data.get
  output_schema:
