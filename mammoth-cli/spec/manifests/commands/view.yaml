    "DAY", "MINUEND": {"TYPE": "__TIME__"}, "SUBTRAHEND": {"TYPE": "COLUMN", "VALUE": "INTERNAL_COLUMN_NAME"},
    "AS": {"COLUMN": "Days Since Order", "TYPE": "NUMERIC", "INTERNAL_NAME": "column_days_since_order"}}},
    where INTERNAL_COLUMN_NAME is that column''s internal_name from view get (not its display name --
    a raw task skips display-name resolution). MINUEND minus SUBTRAHEND; swap them to flip the sign. Evidence:
    mvc-service api/api/dataview/helpers/validators/date_diff.py (allowed TYPE values COLUMN/VALUE/SYSTEM_TIME)
    and CommonConstants/dba_const.py KEYWORDS.SYSTEM_TIME = "__TIME__".'
