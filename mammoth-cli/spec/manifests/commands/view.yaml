- command_id: view.data.query
  output_schema:
    ref: OpenObject
- command_id: view.data.aggregate
  output_schema:
    ref: OpenObject
  mutation_class: read
  wait_policy: always_wait
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: No automated disposable-view fixture wired into tests/live yet for this command.
  known_restrictions: 'Read-only: computes and returns an aggregated result without adding a task to the
    view''s pipeline or otherwise changing it. Pass exactly one of ''aggregations'' (a PIVOT group-by;
    ''group_by'' is optional) or ''metric'' (a single METRIC value). ''function'' is one of SUM, COUNT,
    AVG, MIN, MAX, STDDEV, DISTINCT_COUNT. A group_by item is a column name, or {"column": C, "truncate":
    DAY|WEEK|MONTH|QUARTER|YEAR} to bucket a DATE (a trend over time), or {"column": C, "resolution":
    N} to bucket a NUMERIC; grouping by a raw date gives one row per day. A metric is a number: only COUNT
    and DISTINCT_COUNT work on a DATE or TEXT column. For one column''s trend, top values or spread, view
    data explore is the shorter call. order_by (result labels; a string like ''Total desc'' or {column,
    direction}) with top ranks the groups on the backend; a limit without order_by keeps arbitrary rows
    and the result says ordered false. A group_by truncate on a TEXT column of dates is bucketed by the
    CLI: the stored format is detected from the data and stated in text_dates, an ambiguous day/month
    order (settle it with text_date_format) or an unreadable value fails loud, and a range condition (GT,
    GTE, LT, LTE, IN_RANGE with a YYYY-MM-DD value) on such a column works the same way. A truncate on
    a NUMERIC column, or a resolution on a non-NUMERIC one, is refused. To group by the part of a date,
    give {"column": C, "part": weekday|day|month|quarter|year} on a DATE or TEXT-date column: the groups are
    named (Monday, January, Q1) and in calendar order. This is the read-only way to answer by-weekday
    and by-month questions. An empty result carries observed_range: the min and max of the filtered or
    date column.'
  unset:
  - edits_target
- command_id: view.data.compare
  output_schema:
    ref: ViewDataCompare
  command_path: view data compare
  disposition: command
  alias_of: null
  operation_ids:
  - ExecuteVolatileQuery
  positionals:
  - name: view_id_a
    type: int
    required: true
    metavar: VIEW_ID_A
    falls_back_to_field: null
    help: ID of the first view to compare.
  - name: view_id_b
    type: int
    required: true
    metavar: VIEW_ID_B
    falls_back_to_field: null
    help: ID of the second view to compare.
  options: []
  sdk_symbol: mammoth.api.dataviews.DataviewsAPI.aggregate
  sdk_conversion: Runs view.data.aggregate's own handler once per view (which calls mammoth.api.dataviews.DataviewsAPI.aggregate),
    then joins client-side; recorded here so discovery advertises the same accepted document fields view.data.aggregate
    does, not this command's own dispatch (see _VIEW_DATA_COMPARE_FIELDS in command_contract.py).
  request_model: ViewDataCompareRequest
  result_model: ViewDataCompareResult
  mutation_class: read
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_read_only
  live_test: null
  live_exemption_reason: Delegates to view.data.aggregate's own live coverage for the actual SDK call;
    the join/compare step itself is local and deterministic.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth view data compare VIEW_ID_A VIEW_ID_B --help
  agent_example: 'mammoth view data compare 111 222 --input ''{"group_by": ["Campaign"], "aggregations":
    [{"column": "Spend", "function": "SUM", "as_name": "Spend"}]}'''
  unit_tests:
  - UT-VIEW-DATA-COMPARE
  contract_tests:
  - CT-VIEW-DATA-COMPARE
  draft_test: null
  undo_test: null
  known_restrictions: 'Every number reported to the user comes from a tool result: use this to compare
    the same PIVOT/METRIC aggregate across two views (e.g. two platforms'' totals per campaign) instead
    of subtracting two ''view data aggregate'' reads by hand -- calc is the tool for a single expression.
    Takes the exact same --input shape as view data aggregate (aggregations/group_by, or metric); rows
    are joined on the group-by key (or compared as a single row for a bare metric) using exact Decimal
    arithmetic. A key present in only one view''s result is not an error: ''only_in_first'' and
    ''only_in_second'' give its exact count and the first 25 rows, and ''rows'' holds the keys both
    views have.'
  reviewed_by: primary
- command_id: view.data.explore
  output_schema:
    ref: OpenObject
  command_path: view data explore
  disposition: command
  alias_of: null
  operation_ids:
  - ExecuteVolatileQuery
  positionals:
  - name: view_id
    type: int
    required: true
    metavar: VIEW_ID
    falls_back_to_field: null
    help: ID of the view to act on.
  - name: column
    type: str
    required: true
    metavar: COLUMN
    falls_back_to_field: null
    help: Display name of the column to explore.
  - name: dataset_id
    type: int
    required: false
    metavar: DATASET_ID
    falls_back_to_field: dataset_id
    help: ID of the dataset the view belongs to; resolved from the view when omitted.
  options: []
  sdk_symbol: mammoth.api.dataviews.DataviewsAPI.explore
  sdk_conversion: Call mammoth.api.dataviews.DataviewsAPI.explore with validated request fields.
  request_model: ViewDataExploreRequest
  result_model: ViewDataExploreResult
  mutation_class: read
  confirmation: none
  wait_policy: always_wait
  pagination_policy: none
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: No automated disposable-view fixture wired into tests/live yet for this command.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth view data explore VIEW_ID COLUMN --help
  agent_example: mammoth view data explore 123 Status 456
  unit_tests:
  - UT-VIEW-DATA-EXPLORE
  contract_tests:
  - CT-VIEW-DATA-EXPLORE-HUMAN
  - CT-VIEW-DATA-EXPLORE-JSON
  - CT-VIEW-DATA-EXPLORE-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: 'Read-only: reads one column''s value distribution -- trend, distribution, histogram,
    or top values. It does not open or change any card in the UI; to open Explore cards use ''view explore-panel
    set''. It reads without adding a task to the view''s pipeline (never use ''view transform pivot''
    just to explore). DATE column: counts per ''level'' bucket (AUTO default; SECOND, MINUTE, HOUR, DAY,
    WEEK, MONTH, QUARTER, YEAR, DECADE, CENTURY, MILLENNIUM) for "what''s trending", "over time", "by
    month", "by year". NUMERIC column: counts per ''level'' resolution (AUTO default; a power of 10) for
    a distribution or histogram. TEXT column: top values by count, ''limit'' default 20 -- "what''s in
    this column". Every bucket has ''count'' and ''percentage'' of the total. ''row_count'' is the number
    of unique values (buckets). Options (--input): ''metric'' {"column","function"} adds a per-bucket
    SUM, COUNT, AVG, MIN, MAX, STDDEV or DISTINCT_COUNT over another column (the custom card); ''condition''
    filters rows first -- include/exclude values, blanks, a date or number range, text contains -- and
    several cards'' selections combine as one AND condition (cross-filter); drill down by re-running at
    a finer ''level'' with a ''condition'' on the chosen bucket''s range; ''percentage_of'' "metric" makes
    ''percentage'' the share of the ''metric'' total (default: of the count); ''sort'' count_desc, count_asc,
    value_asc, value_desc, metric_desc or metric_asc (blanks last; the card puts them first); ''limit''
    and ''offset'' page the buckets ("load more"); ''range'' true adds the exact earliest and latest value
    of a DATE or NUMERIC column under the same condition; ''-o csv'' prints the buckets as CSV; ''sequence''
    explores at a pipeline step. To exclude a value the way the card does (blank rows stay), use or(NE
    value, IS_EMPTY on that column): a plain NE, NOT_IN_LIST or not drops blank rows. To put the card
    on a dashboard, say it in words: ''dashboard chat edit DASHBOARD_ID'' (prompt) or ''dashboard v3 generate''.
    Search several columns for text: or of CONTAINS per text column. Replace all values like this: ''view
    transform replace''. Related: distinct raw values of a DATE/NUMERIC column, a summary (min/max/sum/avg)
    or a matching-row count -> ''view data aggregate''; keep the filter as a pipeline step -> ''view transform
    filter''; save it as a new view -> ''view create'' then ''view transform filter'' on it; download
    all rows -> ''view export csv''. A TEXT column of dates takes a level (or column_type DATE): the format
    is detected from the data and stated in text_dates; ambiguous or unreadable dates fail loud. A column_type
    that disagrees with the stored type is refused, never dropped. Example: --input ''{"level": "MONTH",
    "condition": {"column": "Results", "operator": "EQ", "value": "Fail"}}''. A figure for a period (year,
    quarter, month) is one explore of the DATE column with level YEAR, QUARTER or MONTH and a metric {"column":
    AMOUNT, "function": "SUM"}: it returns one figure per period and the date range the data covers, so
    no rows need paging. cumulative true adds a running total; keep one year or range with condition,
    for a year {"column": DATE_COLUMN, "operator": "=", "value": 2017, "component": "year"}. Figures come
    back rounded to two decimals: quote them as returned.'
  reviewed_by: primary
- command_id: view.data.profile
  output_schema:
    ref: OpenObject
  command_path: view data profile
  disposition: command
  alias_of: null
  operation_ids:
  - ExecuteVolatileQuery
  positionals:
  - name: view_id
    type: int
    required: true
    metavar: VIEW_ID
    falls_back_to_field: null
    help: ID of the view to act on.
  - name: dataset_id
    type: int
    required: false
    metavar: DATASET_ID
    falls_back_to_field: dataset_id
    help: ID of the dataset the view belongs to; resolved from the view when omitted.
  options: []
  sdk_symbol: mammoth.api.dataviews.DataviewsAPI.aggregate
  sdk_conversion: Reads the stored column stats (mammoth.api.ai.AIAPI.generate_profile, action stats),
    then runs whole-view aggregate jobs (mammoth.api.dataviews.DataviewsAPI.aggregate) only for what is
    not stored, from mammoth_cli.commands.view_profile; the accepted document fields are _VIEW_DATA_PROFILE_FIELDS
    in command_contract.py.
  request_model: ViewDataProfileRequest
  result_model: ViewDataProfileResult
  mutation_class: read
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_read_only
  live_test: null
  live_exemption_reason: Live coverage is tests/live/test_view_profile.py (runs on the test server); the
    arithmetic is unit-tested in tests/unit/services/test_data_profile.py.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth view data profile VIEW_ID --help
  agent_example: 'mammoth view data profile 123 --input ''{"target": "Churn"}'''
  unit_tests:
  - UT-VIEW-DATA-PROFILE
  contract_tests:
  - CT-VIEW-DATA-PROFILE
  draft_test: null
  undo_test: null
  known_restrictions: 'Read-only profile of the WHOLE view (every row, not a page of 50): per column the
    blank count, distinct count, min and max (NUMERIC and DATE) and top values; a "summary" of constant,
    all-blank and mostly-blank columns; "spelling_variants" per TEXT column -- spellings of one value
    that differ by case, punctuation or legal form (Ltd = Limited, Inc = Incorporated ...) -- with a ready
    "bulk_replace" input and the full "command" to merge them. Use it to explore, understand or profile
    a dataset, find blanks, duplicates and dirty categories. Blanks, distinct counts and min/max come
    from the stats the backend stored for the view when their row count equals the view row count now;
    otherwise (stale after a pipeline step, or none stored) they are queried in a few multi-column pivots.
    The "sources" block says which, and that the backend records no as-of time; each column "from" says
    stored or query. Top values, spelling variants and the target comparison are always queried. --input:
    "target" (a column with 2-20 values, e.g. churn) adds the target distribution (positive_rate of its
    rarest class) and "association": "categorical" columns ranked by cramers_v (one grouped count per
    column) and "numeric" columns ranked by standardized_difference (two multi-column pivots) -- the churn
    drivers; "columns" (names) profiles only those; "top" values per column (default 5); "limit" columns
    shown in detail (default 50; the summary always covers all). A column with more than 5000 distinct
    values gets counts and min/max but no value list. Example: --input ''{"target": "CHURN", "limit":
    20}''.'
  reviewed_by: primary
- command_id: view.data.drivers
  output_schema:
    ref: OpenObject
  command_path: view data drivers
  disposition: command
  alias_of: null
  operation_ids: []
  positionals:
  - name: view_id
    type: int
    required: true
    metavar: VIEW_ID
    falls_back_to_field: null
    help: 'ID of the view whose figures rose or dropped: the change to explain.'
  - name: dataset_id
    type: int
    required: false
    metavar: DATASET_ID
    falls_back_to_field: null
    help: ID of the dataset the view belongs to; resolved from the view when omitted.
  options: []
  sdk_symbol: mammoth_cli.commands.view_drivers.view_data_drivers
  sdk_conversion: Runs view data aggregate's own helpers (mammoth.api.dataviews.DataviewsAPI.aggregate)
    once per 'by' column, grouped by that column and a date bucket over both periods, then splits the
    buckets into the two periods client-side; the accepted document fields are the view.data.drivers entry
    of _LOCAL_CONTRACT_FIELDS in command_contract.py.
  request_model: ViewDataDriversRequest
  result_model: ViewDataDriversResult
  mutation_class: read
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_read_only
  live_test: null
  live_exemption_reason: Read-only composite over view.data.aggregate's live-covered SDK call; the period
    split and ranking are local and unit-tested.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth view data drivers VIEW_ID --help
  agent_example: 'mammoth view data drivers 123 --input ''{"measure": {"column": "revenue", "function":
    "SUM"}, "date_column": "sale_date", "compare": ["2026-07", "2026-08"], "by": ["store", "category"]}'''
  unit_tests:
  - UT-VIEW-DATA-DRIVERS
  contract_tests:
  - CT-VIEW-DATA-DRIVERS-HUMAN
  - CT-VIEW-DATA-DRIVERS-JSON
  - CT-VIEW-DATA-DRIVERS-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: 'Read-only. Use this, not a series of view data aggregate reads, for "why did X
    drop/rise", "what drove the change between July and August", "explain the decline": one call returns
    the total for each period, the change and its percentage, whether it came from volume (the row count)
    or value (value per row), and per ''by'' column the groups that moved most with their signed share_of_change.
    --input: "measure" {"column", "function": SUM or COUNT}; "date_column"; "compare" [A, B], each ''YYYY-MM'',
    ''YYYY-Qn'', ''YYYY'' or {"from": "YYYY-MM-DD", "to": "YYYY-MM-DD"} (the change is read from A to
    B; any other form is refused); "by" 1 to 3 columns; optional "conditions" in view data aggregate''s
    condition shape. partial_period names a period the data does not cover to its end (or from its start):
    say it is incomplete, never compare it as a whole period. Answer with the total change first, then
    the top contributors with their share, then volume vs value. Amounts carry the currency in ''currency'';
    when it is null give plain numbers and never invent a currency.'
  reviewed_by: primary
- command_id: view.data.forecast
  output_schema:
    ref: OpenObject
  command_path: view data forecast
  disposition: command
  alias_of: null
  operation_ids: []
  positionals:
  - name: view_id
    type: int
    required: true
    metavar: VIEW_ID
    falls_back_to_field: null
    help: ID of the view to forecast from, e.g. to estimate what revenue will be next month or in October.
  - name: dataset_id
    type: int
    required: false
    metavar: DATASET_ID
    falls_back_to_field: null
    help: ID of the dataset the view belongs to; resolved from the view when omitted.
  options: []
  sdk_symbol: mammoth_cli.commands.view_forecast.view_data_forecast
  sdk_conversion: Runs view data aggregate's own helpers (mammoth.api.dataviews.DataviewsAPI.aggregate)
    once, grouped by the date column truncated to the unit, then fits the trend client-side; the accepted
    document fields are the view.data.forecast entry of _LOCAL_CONTRACT_FIELDS in command_contract.py.
  request_model: ViewDataForecastRequest
  result_model: ViewDataForecastResult
  mutation_class: read
  confirmation: none
  wait_policy: not_async
  pagination_policy: none
  acceptance_evidence: live_read_only
  live_test: null
  live_exemption_reason: Read-only composite over view.data.aggregate's live-covered SDK call; the trend
    fit and interval are local and unit-tested.
  contract_fixture: null
  required_fixture_guard: null
  secret_fields: []
  human_example: mammoth view data forecast VIEW_ID --help
  agent_example: 'mammoth view data forecast 123 --input ''{"measure": {"column": "revenue", "function":
    "SUM"}, "date_column": "sale_date", "unit": "month", "periods": 2}'''
  unit_tests:
  - UT-VIEW-DATA-FORECAST
  contract_tests:
  - CT-VIEW-DATA-FORECAST-HUMAN
  - CT-VIEW-DATA-FORECAST-JSON
  - CT-VIEW-DATA-FORECAST-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: 'Read-only. Use this for "forecast", "projection", "estimate next month", "what
    will revenue be in October": never divide a partial period by its days or extend a trend by hand.
    --input: "measure" {"column", "function"} as view data aggregate takes; "date_column"; "unit" month
    (default), quarter or week; "periods" 1 to 12 (default 1); optional "conditions" in view data aggregate''s
    condition shape. It reads the measure per period in one aggregate and fits an ordinary least-squares
    linear trend to the complete periods, adding a seasonal index only with two full cycles (24 months,
    8 quarters, 104 weeks; otherwise seasonal is false), with a t-based 95% prediction interval (low,
    high). A last period the data does not cover to its end is left out of the fit and reported as excluded_partial
    (its value so far and data_through); it is the first period forecast. The forecast starts after the
    last period in the data: when the data ends in mid-September and the user asks for October, pass periods
    2 and quote October. Fewer than 3 complete periods is refused. Give the estimate with its range, name
    the method, never present it as certain; amounts carry the currency in ''currency'', and when it is
    null give plain numbers and never invent a currency.'
  reviewed_by: primary
