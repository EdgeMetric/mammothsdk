  options: []
  sdk_symbol: mammoth.api.dataviews.DataviewsAPI.explore
  sdk_conversion: Call mammoth.api.dataviews.DataviewsAPI.explore with validated request fields.
  request_model: ViewDataExploreRequest
  result_model: ViewDataExploreResult
  mutation_class: read
  confirmation: none
  wait_policy: always_wait
  pagination_policy: none
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: No automated disposable-view fixture wired into tests/live yet for this command.
  contract_fixture: null
