  human_example: mammoth view data aggregate VIEW_ID --help
  agent_example: 'mammoth view data aggregate 123 --input ''{"group_by": ["Channel"], "aggregations":
    [{"column": "Spend", "function": "SUM", "as_name": "Total Spend"}]}'''
  unit_tests:
  - UT-VIEW-DATA-AGGREGATE
