- command_id: view.explore-panel.export-image
  output_schema:
    ref: ViewExplorePanelExportImage
  sdk_conversion: Read the view's saved Explore panel and the card's grouped rows, build the engine figure
    spec from them, call mammoth.api.dashboards.DashboardsAPI.render_figure_svg, and write the returned
    SVG to output_path.
  edits_target: false
  acceptance_evidence: contract_only_no_disposable_fixture
  no_readback: the result carries output_path, the file written; the SVG is not echoed
  live_test: null
  live_exemption_reason: The render route is not deployed to koyal yet (mvc-service PR
  known_restrictions: 'Writes the open Explore card "card" (its column display name) as an SVG file at
    "output_path" (default explore-card-VIEW_ID.svg). The backend has no rasterizer, so this writes SVG
    only; the web app''s PNG is a browser screenshot. A bar card becomes a bar chart (one bar per group,
    its value the card''s metric); a list card becomes a table of its rows. The rows are read as view
    data explore reads them, so the list is the top values the backend returns (TEXT: 20). "style_id"
    optionally renders with a saved style. The card must be open (view explore-panel set). Not available
    inside the Mammoth app: it writes a file on the host. It is a per-user preference read; it does not
    change the view or the panel.'
