    is used (never invent a name such as the view''s name). The export is appended to the source pipeline
    (end_of_pipeline) and re-runs with it; target_project_id sends the dataset into another project (cross-project
    branch-out, proven on release). Result: {dataset_id, project_id, source_view_id, next}. Not a plain
    copy: this leaves a live export on the source and the new dataset refreshes from the source view,
    so keep that working view and name it as the new dataset''s source. For an independent copy of a dataset
    use dataset create with ds_creation_type clone. Writing into an existing dataset (target_ds_id, save_as_mode
    APPEND_TO_DS or REPLACE_IN_DS; both run the same backend append code, so both get these guards): omit
    column_mapping and every column is mapped by name; a non-empty column_mapping is used as-is, so it
    must map every source column to an existing target column, and a partial mapping or an unknown destination
    is refused (append_mapping_incomplete) before anything is written. A target column that nothing fills
    (a column the source view lacks and column_mapping does not target) would be NULL in every appended
    row: refused (append_leaves_columns_blank) unless the input lists exactly those column names in blank_columns
    (a blanket true or a different list is refused); the confirmed blanks are named in row_check.warnings.
    Do not reshape the source view to dodge this. A mapped pair of different types is reported in row_check.warnings.
    A new dataset (no target_ds_id) leaves out the view''s hidden columns; they are named in row_check.warnings.
    To stack two datasets (a union, new rows below the old): there is no union step, so export the second
    dataset''s view into the first with save_as_mode APPEND_TO_DS and target_ds_id the first dataset (columns
    are matched by name). The export stays a step of the source view and runs again when that view''s
    pipeline re-runs, so after a refresh check the target''s row count for rows added twice. A real union
    step needs backend work.'
