  - CT-VIEW-DATA-AGGREGATE-HUMAN
  - CT-VIEW-DATA-AGGREGATE-JSON
  - CT-VIEW-DATA-AGGREGATE-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: 'Read-only: computes and returns an aggregated result without adding a task to the
    view''s pipeline or otherwise changing it. Pass exactly one of ''aggregations'' (a PIVOT group-by;
    ''group_by'' is optional) or ''metric'' (a single METRIC value). ''function'' is one of SUM, COUNT,
    AVG, MIN, MAX, STDDEV, DISTINCT_COUNT. A group_by item is a column name, or {"column": C, "truncate":
    DAY|WEEK|MONTH|QUARTER|YEAR} to bucket a DATE (a trend over time), or {"column": C, "resolution":
    N} to bucket a NUMERIC; grouping by a raw date gives one row per day. A metric is a number: only COUNT
    and DISTINCT_COUNT work on a DATE or TEXT column. For one column''s trend, top values or spread, view
    data explore is the shorter call. order_by (result labels; a string like ''Total desc'' or {column,
    direction}) with top ranks the groups on the backend; a limit without order_by keeps arbitrary rows
    and the result says ordered false. A group_by truncate on a TEXT column of dates is bucketed by the
    CLI: the stored format is detected from the data and stated in text_dates, an ambiguous day/month
    order (settle it with text_date_format) or an unreadable value fails loud, and a range condition
    (GT, GTE, LT, LTE, IN_RANGE with a YYYY-MM-DD value) on such a column works the same way. A truncate on
    a NUMERIC column, or a resolution on a non-NUMERIC one, is refused. To group by the part of a date,
    give {"column": C, "part": weekday|month|quarter|year} on a DATE or TEXT-date column: the groups are
    named (Monday, January, Q1) and in calendar order. This is the read-only way to answer by-weekday and
    by-month questions. An empty result carries
    observed_range: the min and max of the filtered or date column.'
  reviewed_by: primary
