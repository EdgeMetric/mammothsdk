  options: []
  sdk_symbol: mammoth.api.dataviews.DataviewsAPI.aggregate
  sdk_conversion: Reads the stored column stats (mammoth.api.ai.AIAPI.generate_profile, action stats), then
    runs whole-view aggregate jobs (mammoth.api.dataviews.DataviewsAPI.aggregate) only for what is not
    stored, from mammoth_cli.commands.view_profile; the accepted document fields are
    _VIEW_DATA_PROFILE_FIELDS in command_contract.py.
  request_model: ViewDataProfileRequest
  result_model: ViewDataProfileResult
  mutation_class: read
