  contract_tests:
  - CT-VIEW-DATA-EXPLORE-HUMAN
  - CT-VIEW-DATA-EXPLORE-JSON
  - CT-VIEW-DATA-EXPLORE-ERROR
  draft_test: null
  undo_test: null
  known_restrictions: 'Read-only: explore one column the way the web app''s column Explore card does -- trend, distribution, histogram, or top values -- without adding a task to the view''s pipeline (never use ''view transform pivot'' just to explore). DATE column: counts per ''level'' bucket (AUTO default; SECOND, MINUTE, HOUR, DAY, WEEK, MONTH, QUARTER, YEAR, DECADE, CENTURY, MILLENNIUM) for "what''s trending", "over time", "by month", "by year". NUMERIC column: counts per ''level'' resolution (AUTO default; a power of 10) for a distribution or histogram. TEXT column: top values by count, ''limit'' default 20 -- "what''s in this column". Every bucket has ''count'' and ''percentage'' of the total. ''row_count'' is the number of unique values (buckets). Options (--input): ''metric'' {"column","function"} adds a per-bucket SUM, COUNT, AVG, MIN, MAX, STDDEV or DISTINCT_COUNT over another column (the custom card); ''condition'' filters rows first -- include/exclude values, blanks, a date or number range, text contains -- and several cards'' selections combine as one AND condition (cross-filter); drill down by re-running at a finer ''level'' with a ''condition'' on the chosen bucket''s range; ''percentage_of'' "metric" makes ''percentage'' the share of the ''metric'' total (default: of the count); ''sort'' count_desc, count_asc, value_asc, value_desc, metric_desc or metric_asc (blanks last; the card puts them first); ''limit'' and ''offset'' page the buckets ("load more"); ''range'' true adds the exact earliest and latest value of a DATE or NUMERIC column under the same condition; ''-o csv'' prints the buckets as CSV; ''sequence'' explores at a pipeline step. To exclude a value the way the card does (blank rows stay), use or(NE value, IS_EMPTY on that column): a plain NE, NOT_IN_LIST or not drops blank rows. To put the card on a dashboard, say it in words: ''dashboard chat edit DASHBOARD_ID'' (prompt) or ''dashboard v3 generate''. Search several columns for text: or of CONTAINS per text column. Replace all values like this: ''view transform replace''. Related: distinct raw values of a DATE/NUMERIC column, a summary (min/max/sum/avg) or a matching-row count -> ''view data aggregate''; keep the filter as a pipeline step -> ''view transform filter''; save it as a new view -> ''view create'' then ''view transform filter'' on it; download all rows -> ''view export csv''. A TEXT column of dates takes a level (or column_type DATE): the format is detected from the data and stated in text_dates; ambiguous or unreadable dates fail loud. A column_type that disagrees with the stored type is refused, never dropped. Example: --input ''{"level": "MONTH", "condition": {"column": "Results", "operator": "EQ", "value": "Fail"}}''. A figure for a period (year, quarter, month) is one explore of the DATE column with level YEAR, QUARTER or MONTH and a metric {"column": AMOUNT, "function": "SUM"}: it returns one figure per period and the date range the data covers, so no rows need paging. cumulative true adds a running total; keep one year or range with condition, for a year {"column": DATE_COLUMN, "operator": "=", "value": 2017, "component": "year"}. Figures come back rounded to two decimals: quote them as returned.'
