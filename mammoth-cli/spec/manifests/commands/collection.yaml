manifest_schema_version: 1
commands:
- command_id: collection.list
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read of a disposable collection or board; not in the automated live suite.
  known_restrictions: Read-only. The collections you manage or were shared, each with its role (manager
    or member), url, project and dashboard count.
- command_id: collection.get
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read of a disposable collection or board; not in the automated live suite.
  known_restrictions: Read-only. One collection with its dashboards in order, its members (managers only),
    and its refresh setup.
- command_id: collection.get-by-url
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read of a disposable collection or board; not in the automated live suite.
  known_restrictions: Read-only. Opens a collection by its share url token, as a viewer does. Input t
    is the invite token, which the server redeems on the way in; email is the address the invite went
    to.
- command_id: collection.create
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: collection.get
    ids:
      collection_id: result.id
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: Creates a collection in the active project (--project, or input project_id). name
    is 1 to 120 characters; dashboard_ids puts boards in it, in order. Nobody else sees it until collection
    share.
- command_id: collection.update
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: collection.get
    ids:
      collection_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: 'Changes only the fields given: name, description, order (every dashboard id, in
    the new order), tab_labels (dashboard id to a short label; empty clears it), automation_id to link
    the upload-to-refresh automation, or unlink_automation.'
- command_id: collection.delete
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: collection.list
    ids: {}
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: Deletes the collection and ends every member's access through it. The dashboards
    in it are kept.
- command_id: collection.dashboards.add
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: collection.dashboards.remove
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: collection.get
    ids:
      collection_id: positional.0
    kind: object
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: Adds dashboards to the collection, which gives its members access to them. notify
    true also emails the members. Always needs --yes.
- command_id: collection.dashboards.remove
  output_schema:
    ref: WriteResult
  undo:
    strategy: manual
    command: collection.dashboards.add
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: collection.get
    ids:
      collection_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: Takes one dashboard out of the collection. The dashboard is kept.
- command_id: collection.share
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: collection.get
    ids:
      collection_id: positional.0
    kind: object
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: 'Gives people access to the collection by email and sends them the invite. The result
    lists added, already (members before) and in_project (skipped: they already edit the project''s boards).
    Always needs --yes.'
- command_id: collection.members.remove
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: collection.get
    ids:
      collection_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: Takes one person off the collection by email.
- command_id: collection.for-dashboard
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read of a disposable collection or board; not in the automated live suite.
  known_restrictions: Read-only. The collections that hold this dashboard, in the shape collection list
    returns.
- command_id: collection.activity
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read of a disposable collection or board; not in the automated live suite.
  known_restrictions: 'Read-only. Who opened the collection and which of its dashboards get opened: opened,
    member_count, people (email, status, last_opened_at) and dashboards (views, viewers).'
- command_id: collection.pipeline-changes
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read of a disposable collection or board; not in the automated live suite.
  known_restrictions: Read-only. Progress of the collection's data refresh; empty when no automation is
    linked.
- command_id: collection.files.upload
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: collection.get
    ids:
      collection_id: positional.0
    kind: object
  live_test: null
  live_exemption_reason: Write with contract coverage but no automated disposable fixture in tests/live.
  known_restrictions: Uploads local files to refresh the collection's data. Input files is the list of
    paths; append_to_ds_id appends to one of the refresh datasets. The server answers with an upload job
    id and refreshes in the background.
- command_id: collection.active-job
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read of a disposable collection; not in the automated live suite.
  known_restrictions: Read-only. Returns the collection's upload job that is still in flight, so an interrupted
    upload can be resumed. Use collection job to poll one job by id.
- command_id: collection.job
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Read of a disposable collection job; not in the automated live suite.
  known_restrictions: Read-only. Polls one collection upload job by id and returns its state.
- command_id: collection.email-updates.get
  output_schema: openapi
- command_id: collection.email-updates.me.get
  output_schema: openapi
- command_id: collection.email-updates.me.set
  output_schema:
    ref: WriteResult
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: collection.email-updates.me.get
    ids:
      collection_id: positional.0
    kind: object
  live_test: None
  live_exemption_reason: No disposable fixture covers this write; contract and unit tests cover it.
  known_restrictions: Turns your own email updates for the collection on or off; nobody else's.
- command_id: collection.email-updates.set
  output_schema:
    ref: WriteResult
  mutation_class: external_effect
  confirmation: yes_always
  acceptance_evidence: contract_only_high_impact
  readback:
    command: collection.email-updates.get
    ids:
      collection_id: positional.0
    kind: object
  live_test: None
  live_exemption_reason: Sends or changes outbound mail or access for real people, so it is not run against
    a live server; contract and unit tests cover it.
  agent_example: 'mammoth collection email-updates set 123 --input ''{"enabled": true, "timezone": "UTC"}''
    --yes'
  known_restrictions: Saves the collection's email-update schedule and the phone numbers or people it
    reaches. Needs --yes. Editors only.
- command_id: collection.email-updates.test
  output_schema:
    ref: WriteResult
  mutation_class: external_effect
  confirmation: yes_always
  acceptance_evidence: contract_only_high_impact
  no_readback: Sends one email now; nothing is stored that a read command returns.
  live_test: None
  live_exemption_reason: Sends or changes outbound mail or access for real people, so it is not run against
    a live server; contract and unit tests cover it.
  agent_example: mammoth collection email-updates test 123 --yes
  known_restrictions: Sends a real test email update right away. Needs --yes.
