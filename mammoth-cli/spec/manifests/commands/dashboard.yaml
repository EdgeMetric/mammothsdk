- command_id: dashboard.figure.add
  output_schema:
    ref: WriteResult
  readback:
    command: dashboard.canvas.get
    ids:
      dashboard_id: positional.0
    kind: object
  known_restrictions: 'Adds one figure (an explore card) with no chat turn. Pass {"intent": "..."} (optional
    kind) and the server picks and draws the chart, as dashboard figure-intent does; or pass an exact
    figure. With a figure, dataview_id must be the dashboard''s own view. figure is the figure as the
    canvas stores it, without its id: kind plus its bindings (measure, dim, agg, title). Optional banded
    (a banded dimension without its id; figure.dim then points at it) and page: {"id": PAGE_ID} for an
    existing content page or {"new_title": "..."} for a new one; with neither the figure lands on the
    first content page. The server checks the figure against the dashboard''s source and queues the bake:
    the result carries bake_job_id; wait for it with job wait.'
- command_id: dashboard.restore
  output_schema:
    ref: WriteResult
  readback:
