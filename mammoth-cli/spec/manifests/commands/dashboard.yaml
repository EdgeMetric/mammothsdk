manifest_schema_version: 1
commands:
- command_id: dashboard.action
  output_schema:
    ref: WriteResult
  readback:
    command: dashboard.get
    ids:
      dashboard_id: positional.0
    kind: object
- command_id: dashboard.analytics
  output_schema: openapi
- command_id: dashboard.archive
  output_schema:
    ref: WriteResult
  readback:
    command: dashboard.get
    ids:
      dashboard_id: positional.0
    kind: object
- command_id: dashboard.assess-pbix
  output_schema:
    ref: OpenObject
- command_id: dashboard.assess-twb
  output_schema:
    ref: OpenObject
- command_id: dashboard.bi-preflight
  output_schema: openapi
  sdk_conversion: Call mammoth.api.dashboards.DashboardsAPI.powerbi_preflight or .tableau_preflight, chosen
    by input `target`, with validated request fields.
  result_model: PowerBiPreflightResponse
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Release-only supplemental binding; no disposable fixture.
  unit_tests:
  - mammoth-cli/tests/unit/commands/test_dashboard.py::test_bi_preflight_dispatches_powerbi
  - mammoth-cli/tests/unit/commands/test_dashboard.py::test_bi_preflight_dispatches_tableau
  - mammoth-cli/tests/unit/commands/test_dashboard.py::test_bi_preflight_rejects_unknown_target_value_without_a_request
  contract_tests:
  - mammoth-cli/tests/contract/test_rel360_bi_export.py::test_rel360_schema_preserves_release_overlay
  known_restrictions: Author-only, like the release routes it calls -- a non-author caller is refused,
    unlike `dashboard pdf export` (which any viewer can run).
- command_id: dashboard.bi-export
  output_schema:
    ref: OpenObject
  sdk_conversion: Call mammoth.api.dashboards.DashboardsAPI.export_powerbi or .export_tableau, chosen
    by input `target`, with validated request fields.
  acceptance_evidence: contract_only_no_disposable_fixture
  live_test: null
  live_exemption_reason: Release-only supplemental binding; no disposable fixture.
  unit_tests:
  - mammoth-cli/tests/unit/commands/test_dashboard.py::test_bi_export_writes_file_in_terminal_mode
  - mammoth-cli/tests/unit/commands/test_dashboard.py::test_bi_export_embedded_points_user_to_export_dialog
  contract_tests:
  - mammoth-cli/tests/contract/test_rel361_bi_export.py::test_rel361_schema_preserves_release_overlay
  known_restrictions: 'Author-only, like bi-preflight. Terminal mode writes `output_path` to local disk.
    Inside the Mammoth app the download cannot reach the user: run `dashboard bi-preflight` to tell them
    what will convert, then send them to the dashboard''s Publish menu (the arrow next to Publish) ->
    Export to Power BI / Export to Tableau, where they download the file themselves. No command makes
    a PDF of a board: that is the board''s Download PDF in the app.'
- command_id: dashboard.cancel-generation
  output_schema:
    ref: WriteResult
  readback:
    command: dashboard.get
    ids:
      dashboard_id: positional.0
    kind: object
- command_id: dashboard.canvas.get
  output_schema:
    ref: DashboardCanvas
  known_restrictions: 'A board''s data is the view in the canvas dataset.dataview_id: read it with view
    data get VIEW_ID. After a board''s bake job, read the canvas and quote one number from it, such as
    a KPI total.'
- command_id: dashboard.canvas.restore
  output_schema:
    ref: WriteResult
  readback:
    command: dashboard.canvas.get
    ids:
      dashboard_id: positional.0
    kind: object
  known_restrictions: target_sequence must be an existing draft version -- get the list from dashboard
    chat history DASHBOARD_ID, whose revisions[] gives {sequence, updated_at, updated_by_name} for every
    saved version, oldest first; pick the sequence to undo/redo/revert to.
- command_id: dashboard.canvas.save
  output_schema:
    ref: WriteResult
  readback:
    command: dashboard.canvas.get
    ids:
      dashboard_id: positional.0
    kind: object
  known_restrictions: 'Read the canvas with dashboard canvas get, edit, write back; a canvas with pages[]
    bakes the ACTIVE page (pages[i].focus / pages[i].added), a root-level focus is stored but produces
    no descriptors. focus.kpis entries are {field, agg, label, unit, decimals, filters}; agg countDistinct
    persists and bakes (ILG simulation 2026-09-19). added[].measure is a column name; a ratio goes in
    canvas.derived[] as {id, numerator, denominator} and is referenced by id from measure or a KPI field.
    Validation errors return the pydantic path (e.g. pages.0.added.2.measure). The response carries bake_job_id:
    job wait it, then dashboard canvas get for meta.figures (figure key -> descriptor id) and dashboard
    descriptor-data to evaluate. This raw route does not pass the LLM unit guard that pages add / chat
    edit apply.'
- command_id: dashboard.chat.edit
  output_schema:
    ref: WriteResult
  readback:
    command: dashboard.canvas.get
    ids:
      dashboard_id: positional.0
    kind: object
  known_restrictions: 'Changes an existing board from one sentence (add, remove or change a chart, KPI
    or page): {"body": {"params": {"prompt": "<the change>"}}}; returns changed, a one-line message, the
    rebaked canvas, dashboard_link and values (the evaluated number of each KPI card and tile after the
    edit). Use it for a change you can say in a sentence; use dashboard canvas save to author the canvas
    yourself (units, hiding built-in tiles).'
- command_id: dashboard.chat.history
  output_schema:
    ref: OpenObject
  known_restrictions: 'The response carries a revisions[] list (one {sequence, updated_at, updated_by_name}
    per saved version, oldest first) -- real on the wire but not yet in the typed SDK model, so read it
    from --output json. It is the version list for dashboard canvas restore''s target_sequence: to undo/revert
    the board, find the sequence to go back to here and pass it there.'
- command_id: dashboard.context.create
  output_schema: openapi
  undo:
    strategy: manual
    command: dashboard.context.delete
  readback:
    command: dashboard.context.list
    ids: {}
    kind: object
- command_id: dashboard.context.delete
  output_schema: openapi
  readback:
    command: dashboard.context.list
    ids: {}
    kind: object
- command_id: dashboard.context.extract
  output_schema:
    ref: WriteResult
  no_readback: ExtractContext returns an extracted preview (condensed/figure data) from an uploaded file;
    nothing is persisted, so no read command can show it.
- command_id: dashboard.context.list
  output_schema: openapi
- command_id: dashboard.context.update
  output_schema: openapi
  readback:
    command: dashboard.context.list
    ids: {}
    kind: object
- command_id: dashboard.create-blank
  output_schema:
    ref: WriteResult
  mutation_class: benign_mutation
  confirmation: none
  readback:
    command: dashboard.get
    ids:
      dashboard_id: result.id
    kind: object
  known_restrictions: 'To build a board from a description, use dashboard v3 generate instead. Input is
    {"params": {"dataview_id": VIEW_ID, "title": ...}} with --yes; returns {id, sequence}. The blank canvas
    has one page (p1) and no figures: author it with dashboard chat edit, or by hand with dashboard canvas
    get -> edit -> dashboard canvas save or dashboard pages add. One dataview per dashboard.'
- command_id: dashboard.data.draft
  output_schema: openapi
- command_id: dashboard.data.published
  output_schema: openapi
- command_id: dashboard.delete
  output_schema:
    ref: WriteResult
  readback:
    command: dashboard.get
    ids:
      dashboard_id: positional.0
    kind: object
- command_id: dashboard.descriptor-data
  output_schema:
    ref: WriteResult
  no_readback: 'DescriptorData evaluates already-baked descriptors and returns their computed values directly
    in the result ({descriptor_id: {status, value|data}}); it does not change persisted dashboard state
    for a read command to show.'
  known_restrictions: 'Evaluates baked descriptors by id. Ids come from dashboard canvas get data.meta.figures[<page>:<kpi|add>:<n>].descriptors.value
    (rows for a table figure) and data.meta.filters. body.params.filter_state is {"<filter field>": value}
    against the canvas''s declared filters: a range control takes [start, end] (dates as YYYY-MM-DD),
    categorical controls a list of values; an undeclared field is rejected. Results are {descriptor_id:
    {status, value | data}}. Used to prove a countDistinct card under a Month range (ILG simulation 2026-09-19).'
- command_id: dashboard.duplicate
  output_schema: {ref: WriteResult}
  wait_policy: start_or_wait
  readback:
    command: dashboard.get
    ids:
      dashboard_id: result.id
    kind: object
  known_restrictions: 'Copies the dashboard over the same dataset. Example: mammoth dashboard duplicate
    123 --input ''{"target_dataview_id": 456}''. With the target_dataview_id input field the copy is made
    in that view''s project and its data swap is queued: the command waits for that job and adds swap_state
    and swap_result next to id and swap_job_id. project_id (optional) names the project for the copy.'
- command_id: dashboard.embed.config.get
  output_schema: openapi
- command_id: dashboard.embed.config.set
  output_schema: openapi
  acceptance_evidence: contract_only_no_disposable_fixture
  readback:
    command: dashboard.embed.config.get
    ids:
      dashboard_id: positional.0
    kind: object
  live_exemption_reason: Dashboard mutation has contract coverage but no automated disposable-dashboard
    fixture in tests/live.
  known_restrictions: null
- command_id: dashboard.embed.key.rotate
  output_schema: openapi
  readback:
    command: dashboard.embed.config.get
