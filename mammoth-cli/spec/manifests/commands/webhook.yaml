manifest_schema_version: 1
commands:
- command_id: webhook.create
  readback:
    command: webhook.get
    ids:
      webhook_id: result.webhook.id
    kind: object
- command_id: webhook.delete
  readback:
    command: webhook.list
    ids: {}
    kind: object
- command_id: webhook.get
- command_id: webhook.list
- command_id: webhook.send
  known_restrictions: 'Delivers a payload to the webhook, which ingests it into its dataset. Never retry
    a send: each call adds data. Check `webhook get` first.'
  no_readback: posts data to an external webhook URL; the external receiver's state is not something this
    CLI can read back
- command_id: webhook.send-get
  no_readback: posts data to an external webhook URL; the external receiver's state is not something this
    CLI can read back
- command_id: webhook.update
  readback:
    command: webhook.get
    ids:
      webhook_id: positional.0
    kind: object
